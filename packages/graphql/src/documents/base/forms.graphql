# 表單設計(表單管理 system.forms;規則正本 docs/modules/forms.md)。
#
# 三件事在這裡就要看得懂:
# 1. 定義四塊(fields / layout / summaryMap / prefills)以 JSON 進出,形狀正本是 `@repo/domain/form`;
#    存草稿與發布都帶 `expectedDraftRevision`(= 讀到的 draftRevision),不符 → CONFLICT
#    (reason DRAFT_REVISION_MISMATCH),前端提示「已被別人更新,請重新載入」。
# 2. 發布四步、退役兩步各是一個交易:任一步失敗全部回到動作前,沒有「發布中斷」與重試。
# 3. `abilities` 已含權限與「是不是自己的表單」判斷,前端直接用,不要再與 usePermissions 相乘。

fragment FormFields on FormModel {
  id
  key
  moduleKey
  moduleName
  name
  isShared
  ownerOrgId
  ownerOrgName
  forkedFrom {
    formKey
    version
  }
  currentVersion
  tabLabelTemplate
  # 表單設定「允許存草稿」(沒設過 = true)
  allowDraft
  # 單號格式(第一次送出時給號);null = 不給號
  serial {
    prefix
    period
    digits
    separator
  }
  # 作廢原因的欄位管理類別 key;null = 作廢原因自由填寫
  voidReasonCategoryKey
  # 依欄位共用:這幾個組織引用欄指到的組織也看得到提交(唯讀);空陣列 = 不共用
  sharedByFieldKeys
  hasDraft
  # 站在租戶內時本租戶的開關;root 視角為 null
  tenantEnabled
  # 只有 root 視角的共用表單有;其餘為空陣列
  assignments {
    tenantOrgId
    tenantName
    enabled
  }
  abilities {
    canEdit
    canAssign
    canSetEnabled
    canFork
  }
  # 本租戶這張表單綁的流程(root 視角與沒綁為 null);isValid = false → 「綁定的流程已失效」
  workflowBinding {
    workflowKey
    workflowName
    isValid
  }
  createdAt
  updatedAt
}

fragment FormVersionFields on FormVersionModel {
  id
  formKey
  # 草稿為 null(發布時才配)
  version
  status
  draftRevision
  baseVersion
  fields
  layout
  summaryMap
  prefills
  changelog
  publishedAt
  publishedBy {
    id
    name
  }
  createdAt
  updatedAt
}

fragment FormValidationFields on FormValidationReport {
  errors {
    code
    message
    location
  }
  warnings {
    code
    message
    location
  }
}

# FormsInput: { moduleKey?, keyword?, page?, pageSize? }
# root 看全部;租戶看分派來的 + 自己的客製表單
query Forms($input: FormsInput!) {
  forms(input: $input) {
    items {
      ...FormFields
    }
    totalCount
    page
    pageSize
  }
}

query Form($key: ID!) {
  form(key: $key) {
    form {
      ...FormFields
    }
  }
}

# CreateFormInput: { key, moduleKey, name };只有站在根組織能建(共用表單),key 建立後不可改
mutation CreateForm($input: CreateFormInput!) {
  createForm(input: $input) {
    form {
      ...FormFields
    }
  }
}

# UpdateFormInput: { key, name?, tabLabelTemplate?, allowDraft?, serial?, voidReasonCategoryKey?, sharedByFieldKeys? };tabLabelTemplate 缺席 = 不動、null = 清空;
# allowDraft 缺席 / null = 不動;serial 缺席 = 不動、null = 不給號(已給的號不收回);
# voidReasonCategoryKey 缺席 = 不動、null / 空白 = 清空(作廢原因自由填寫),要是存在的類別;
# sharedByFieldKeys 缺席 = 不動、null / [] = 不共用,要是目前發布版(沒有就草稿)的表單層組織引用欄
mutation UpdateForm($input: UpdateFormInput!) {
  updateForm(input: $input) {
    form {
      ...FormFields
    }
  }
}

# ForkFormInput: { sourceKey, sourceVersion, key, name };同模組,客製副本自動建本租戶的 org_form
mutation ForkForm($input: ForkFormInput!) {
  forkForm(input: $input) {
    form {
      ...FormFields
    }
  }
}

# 設計器的 lookup 來源清單:底座三種 + 專案登記的來源
query FormLookupProviders {
  formLookupProviders {
    items {
      key
      name
      isBase
      labelField
      valueField
      filterFields
      operatorDefault
      fields {
        key
        type
        label
      }
    }
    totalCount
  }
}

# version 省略 = 草稿(附 validation)
query FormVersion($formKey: ID!, $version: Int) {
  formVersion(formKey: $formKey, version: $version) {
    formVersion {
      ...FormVersionFields
    }
    validation {
      ...FormValidationFields
    }
  }
}

# 版本面板:草稿在最前,其餘新到舊
query FormVersions($formKey: ID!) {
  formVersions(formKey: $formKey) {
    items {
      ...FormVersionFields
    }
    totalCount
  }
}

# CreateFormVersionDraftInput: { formKey, baseVersion? };已有草稿 → CONFLICT(DRAFT_EXISTS)
mutation CreateFormVersionDraft($input: CreateFormVersionDraftInput!) {
  createFormVersionDraft(input: $input) {
    formVersion {
      ...FormVersionFields
    }
    validation {
      ...FormValidationFields
    }
  }
}

# SaveFormVersionDraftInput: { formKey, expectedDraftRevision, fields, layout, summaryMap, prefills }
# 檢查器的錯可以先存(回在 validation),正則不合法 / 不安全直接 VALIDATION_FAILED(extensions.issues)
mutation SaveFormVersionDraft($input: SaveFormVersionDraftInput!) {
  saveFormVersionDraft(input: $input) {
    formVersion {
      ...FormVersionFields
    }
    validation {
      ...FormValidationFields
    }
  }
}

# PublishFormVersionInput: { formKey, expectedDraftRevision, changelog }
# 檢查器有錯 → VALIDATION_FAILED(extensions.issues);兩個發布同時送出只有一個成功
# createdPermission:這次發布新建的依表單新增權限;不自動授予,發布成功畫面提示到角色管理授予
mutation PublishFormVersion($input: PublishFormVersionInput!) {
  publishFormVersion(input: $input) {
    formVersion {
      ...FormVersionFields
    }
    createdPermission {
      key
      name
    }
  }
}

# RetireCurrentVersionInput: { formKey, expectedVersion };兩步一個交易、同一版再退役不改任何東西,currentVersion 已換成別版 → CONFLICT;
# 之後所有租戶都不能新增,再發布新版才恢復
mutation RetireCurrentVersion($input: RetireCurrentVersionInput!) {
  retireCurrentVersion(input: $input) {
    form {
      ...FormFields
    }
  }
}

# ExportFormSeedInput: { formKey, version, revision, changelog };唯讀,回可直接登記的專案設定檔
# 只有站在根組織、共用表單、指名的已發布版本(system.forms.view + edit);不可攜 → VALIDATION_FAILED(extensions.issues 帶 path)
query ExportFormSeed($input: ExportFormSeedInput!) {
  exportFormSeed(input: $input) {
    fileName
    source
  }
}

# ---- 舊版資料升級到新版(只限本租戶沒綁流程的表單;表單所屬模組的 edit) ----

# 各舊版本的筆數(操作者看得到、草稿 / 不綁流程的已完成)+ 補值欄位(目標版 FieldDef,只列改得動的)
# 目標版不是已發布 → CONFLICT(VERSION_NOT_PUBLISHED);本租戶綁了流程 → CONFLICT(FORM_HAS_WORKFLOW)
query FormUpgradePlan($formKey: ID!, $targetVersion: Int!) {
  formUpgradePlan(formKey: $formKey, targetVersion: $targetVersion) {
    groups {
      fromVersion
      count
    }
    fillTargets
  }
}

# UpgradeFormSubmissionsInput: { formKey, targetVersion, fills, clientRequestId };改綁 + 補值 + 重算,不驗證
# skipped.reason:EDIT_CONFLICT(被別人同時改)/ DOCUMENT_TOO_LARGE(容量上限)/ VALUES_INVALID
mutation UpgradeFormSubmissions($input: UpgradeFormSubmissionsInput!) {
  upgradeFormSubmissions(input: $input) {
    upgraded {
      fromVersion
      count
    }
    skipped {
      reason
      count
    }
  }
}

# DeleteFormVersionDraftInput: { formKey, expectedDraftRevision };發布中不可,revision 不符 → CONFLICT
mutation DeleteFormVersionDraft($input: DeleteFormVersionDraftInput!) {
  deleteFormVersionDraft(input: $input) {
    form {
      ...FormFields
    }
  }
}

# ValidateFormVersionInput: { formKey, fields, layout, summaryMap, prefills };不落庫
query ValidateFormVersion($input: ValidateFormVersionInput!) {
  validateFormVersion(input: $input) {
    ...FormValidationFields
  }
}

# PreviewFormVersionInput: { formKey, values?, version? };對草稿(version 缺席)或指定的已發布 / 已退役版本跑計算與條件,不建提交
query PreviewFormVersion($input: PreviewFormVersionInput!) {
  previewFormVersion(input: $input) {
    values
    fieldStates {
      key
      visible
      readonly
      redacted
    }
    summary {
      title
      date
      amount
    }
    fieldErrors {
      fieldKey
      code
      message
    }
  }
}

# AssignFormToTenantsInput: { formKey, tenantOrgIds };root 專屬,已分派的略過
mutation AssignFormToTenants($input: AssignFormToTenantsInput!) {
  assignFormToTenants(input: $input) {
    form {
      ...FormFields
    }
  }
}

# RevokeFormFromTenantInput: { formKey, tenantOrgId };root 專屬,歷史提交照常可讀
mutation RevokeFormFromTenant($input: RevokeFormFromTenantInput!) {
  revokeFormFromTenant(input: $input) {
    form {
      ...FormFields
    }
  }
}

# SetTenantFormEnabledInput: { formKey, enabled };租戶內的開關(org_form.meta.enabled)
mutation SetTenantFormEnabled($input: SetTenantFormEnabledInput!) {
  setTenantFormEnabled(input: $input) {
    form {
      ...FormFields
    }
  }
}

# 模組與權限 → 退役權限清理(根組織專屬):已退役的動態權限與它被多少提交用到
query RetiredFormPermissions {
  retiredFormPermissions {
    items {
      key
      name
      moduleKey
      formKey
      formName
      fieldKey
      action
      retiredAt
      usage {
        draftCount
        draftVersions
        completedCount
        completedVersions
      }
    }
    totalCount
  }
}

# DeleteRetiredPermissionInput: { permissionKey, confirmCompletedUsage? }
# 三層檢查:草稿用到 → PERMISSION_NOT_DELETABLE(USED_BY_DRAFTS);只剩已完成 → 要 confirmCompletedUsage: true
mutation DeleteRetiredPermission($input: DeleteRetiredPermissionInput!) {
  deleteRetiredPermission(input: $input) {
    success
    deletedKey
    usage {
      draftCount
      draftVersions
      completedCount
      completedVersions
    }
  }
}

# 表單模組的列表欄位配置(modules.settings.list);沒設定過為空陣列(前端用預設欄)
query ModuleListColumns($moduleKey: String!) {
  moduleListColumns(moduleKey: $moduleKey) {
    moduleKey
    columns {
      kind
      key
      formKey
      label
      width
      order
    }
    builtin {
      form
      status
      createdBy
    }
  }
}

# SetModuleListColumnsInput: { moduleKey, columns: [{ kind, key, formKey?, label?, width, order }], builtin?: { form, status, createdBy } }
# root 整份覆蓋;欄位(含組合欄模板引用的)要在共用表單目前版本且不是受保護欄位,否則 VALIDATION_FAILED(fields: ["columns.N"]);
# 組合欄 kind TEMPLATE 的 key 是模板、label 是欄名,格式錯定位到 columns.N.label / columns.N.template
mutation SetModuleListColumns($input: SetModuleListColumnsInput!) {
  setModuleListColumns(input: $input) {
    moduleKey
    columns {
      kind
      key
      formKey
      label
      width
      order
    }
    builtin {
      form
      status
      createdBy
    }
  }
}

# 建立共用表單時可選的表單模組:me.modules 裡 engine = FORM 的(站在根組織的超級管理員看得到全部)
query FormEngineModules {
  me {
    modules {
      id
      key
      name
      engine
    }
  }
}
