# 申請中心(apply-center)與審核動作(規則正本 docs/modules/workflows.md)。
#
# 1. 摘要一律是「實例上的快照」(該修訂的標題槽),不是提交最新的摘要:單據重送後,
#    只審過舊修訂的人看到的仍是舊修訂的標題。
# 2. decideTask 的 `result: STEP_CLOSED` 不是錯誤:此關已結束或任務已變更,任務不動,前端提示後重載。
# 3. 詳情(workflowInstance、formSubmission(id, revision))的授權同 canReadSubmissionRevision:
#    申請人讀全部修訂;任務持有者(含曾持有)只讀他審的那個修訂 —— 讀提交要帶 `revision`。

fragment WorkflowTaskFields on WorkflowTaskModel {
  id
  instanceId
  submissionId
  # 讀提交要帶這個修訂號
  revision
  moduleKey
  moduleName
  formKey
  formName
  stepKey
  stepName
  taskKey
  status
  assignee {
    id
    name
  }
  applicant {
    id
    name
  }
  summary {
    title
    date
    amount
  }
  instanceStatus
  decidedAt
  comment
  # 送決定時帶它當 expectedEditVersion
  editVersion
  createdAt
}

fragment WorkflowInstanceFields on WorkflowInstanceModel {
  id
  submissionId
  revision
  moduleKey
  moduleName
  formKey
  formName
  formVersion
  workflowKey
  workflowName
  workflowVersion
  status
  summary {
    title
    date
    amount
  }
  applicant {
    id
    name
  }
  # 平行時多個
  activeStepKeys
  # 版本的每個節點各一列(分支進度)
  steps {
    stepKey
    name
    kind
    mode
    # 這一關可否退回修改(匯合節點 false):審核區塊依它出不出現「退回修改」
    allowReturn
    # 改派 / 新增審核者可否選申請人(這一關「申請人也是審核者時」= 照常審核)
    allowsApplicantAssignee
    status
    blocked
    plan {
      taskKey
      assignee {
        id
        name
      }
      previousAssignees {
        id
        name
      }
      assigneeState
      # 代理人:這一項由 assignee(代理人)承接的原審核者們;沒有代理 / 已改派 → 空陣列
      delegators {
        id
        name
      }
      # 只有流程管理者(abilities.canManage)拿得到:阻擋清單改派(ReassignTask)要它
      taskId
    }
    decisions {
      taskKey
      user {
        id
        name
      }
      decision
      comment
      at
    }
  }
  history {
    at
    kind
    stepKey
    taskKey
    user {
      id
      name
    }
    toUser {
      id
      name
    }
    comment
    result
    # 跳過 / 自動通過的原因(skip_orgs / skip_condition / auto_applicant / auto_prior_approver;其他 null)
    reason
    # 只有 auto_approve_blocked:守門擋下的專案錯誤碼(admin.lifecycle.<碼>)
    code
    # task_created 與決定:這張任務代理的原審核者們(時間軸「由 user 代理 delegators」);其他空陣列
    delegators {
      id
      name
    }
  }
  outcome {
    kind
    stepKey
    taskKey
  }
  editVersion
  myTasks {
    ...WorkflowTaskFields
  }
  abilities {
    canWithdraw
    canManage
  }
  createdAt
  updatedAt
  finishedAt
}

# MyApplicationsInput: { moduleKey?, formKey?, status?, page?, pageSize? }
query MyApplications($input: MyApplicationsInput!) {
  myApplications(input: $input) {
    items {
      id
      moduleKey
      moduleName
      formKey
      formName
      status
      blocked
      revision
      summary {
        title
        date
        amount
      }
      currentInstanceId
      activeSteps {
        stepKey
        name
      }
      submittedAt
      updatedAt
    }
    totalCount
    page
    pageSize
  }
}

# 「新申請」:我能新增且綁了流程的表單,依模組分組
query ApplicableForms {
  applicableForms {
    moduleKey
    moduleName
    forms {
      key
      name
      moduleKey
      currentVersion
      tabLabelTemplate
    }
  }
}

# MyTasksInput: { moduleKey?, formKey?, done?, page?, pageSize? };done = false 待處理 / true 已處理
query MyTasks($input: MyTasksInput!) {
  myTasks(input: $input) {
    items {
      ...WorkflowTaskFields
    }
    totalCount
    page
    pageSize
  }
}

# 頁籤與側欄 badge:待我處理的任務數、我進行中(審核中 / 被退回)的申請數
query ApplyCenterCounts {
  applyCenterCounts {
    myTasks
    myApplications
  }
}

query WorkflowInstance($id: ID!) {
  workflowInstance(id: $id) {
    instance {
      ...WorkflowInstanceFields
    }
  }
}

# DecideTaskInput: { taskId, expectedEditVersion, decision: APPROVE | REJECT | RETURN, comment? }
mutation DecideTask($input: DecideTaskInput!) {
  decideTask(input: $input) {
    task {
      ...WorkflowTaskFields
    }
    result
  }
}

# BatchApproveTasksInput: { taskIds(1–50,重複只算一次), comment? };每一筆一個交易、各自經 beforeApprove。
# results 順序同輸入:ok=false 時 reason = NOT_YOURS(已被處理 / 改派 / 此關已結束)| BLOCKED(專案守門擋下,
# 錯誤碼在 projectReason,文案 admin.lifecycle.<碼>)| FAILED(其他失敗,那一筆回復)。
mutation BatchApproveTasks($input: BatchApproveTasksInput!) {
  batchApproveTasks(input: $input) {
    results {
      taskId
      ok
      reason
      projectReason
    }
  }
}

# ---- 申請人的提交動作(回表單提交;形狀同 FormSubmissionFields,前端直接寫回單筆快取) ----

# WithdrawSubmissionInput: { id, expectedEditVersion };已有審核意見 → CONFLICT(HAS_DECISIONS)
mutation WithdrawSubmission($input: WithdrawSubmissionInput!) {
  withdrawSubmission(input: $input) {
    submission {
      ...FormSubmissionFields
    }
  }
}

# VoidSubmissionInput: { id, expectedEditVersion, reasonKey?, reasonNote };表單設了作廢原因類別時 reasonKey 必填、選 other 時 reasonNote 必填;沒設時 reasonNote = 理由(必填)
mutation VoidSubmission($input: VoidSubmissionInput!) {
  voidSubmission(input: $input) {
    submission {
      ...FormSubmissionFields
    }
  }
}

# CopySubmissionToDraftInput: { id, clientRequestId };回新草稿
mutation CopySubmissionToDraft($input: CopySubmissionToDraftInput!) {
  copySubmissionToDraft(input: $input) {
    submission {
      ...FormSubmissionFields
      # 只有這支的回傳有值:來源引用已失效、被清空的欄位
      clearedFields
    }
  }
}
