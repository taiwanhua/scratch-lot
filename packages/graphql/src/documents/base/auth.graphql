# 登入線(#61 / #65):login / refresh / logout / logoutAllDevices / switchOrg / me
# access token 回 body(前端只放記憶體);refresh token 走 httpOnly cookie,不在 payload。

mutation Login($input: LoginInput!) {
  login(input: $input) {
    accessToken
  }
}

mutation Refresh {
  refresh {
    accessToken
  }
}

mutation Logout {
  logout {
    success
  }
}

mutation LogoutAllDevices {
  logoutAllDevices {
    success
  }
}

mutation SwitchOrg($input: SwitchOrgInput!) {
  switchOrg(input: $input) {
    accessToken
  }
}

# modules = PermissionResolver 算出的模組陣列(ADR-0011;#63):route 為完整路徑(api 樹為 null)、
# permissions 為完整權限 key 字串(含展開後的 `<模組 key>.*`),前端據此組側欄、守路由、判斷頁內功能
query Me {
  me {
    id
    account
    name
    email
    nickname
    mustChangePassword
    # logoUrl 是 api 現簽的短效網址(ADR-0010;#137 的 StorageService),側欄用它顯示商標。
    # 只有當前組織要:組織切換器的清單不顯示商標,每一筆都簽一張是白付的成本
    currentOrg {
      id
      name
      logoUrl
      # 租戶時區(IANA):表單的日期時間欄以它輸入與顯示;已送出的修訂用那次的 ctx.timezone
      timezone
      # 最上層組織名稱(租戶頂層;根組織 = 自己):單據(58mm)上方印的租戶名稱,不印分店名稱
      tenantName
      # 最上層組織 id(租戶頂層;根組織 = null):填寫中表達式的 ctx.tenant.id
      tenantId
    }
    orgs {
      id
      name
    }
    modules {
      id
      key
      name
      parentId
      sidebarType
      order
      route
      # 側欄圖示 key(白名單 @repo/domain/module-icon;#288):null = 用預設圖示。
      # 值由根組織在「模組與權限」頁管理,前端以 key 查 @repo/ui 的登錄表,認不得就退回預設
      icon
      # FORM = 表單模組:沒有專屬說明檔時「?」退回表單模組通用說明(admin lib/base/help-registry)
      engine
      permissions
    }
  }
}

# 密碼流程(#61 / #68;api 端 #64):三個入口共用「設定新密碼」頁(user-manager.md「密碼流程」)。
# requestPasswordReset / setPassword 為公開端點(admin 用 session.publicClient);changePassword 要已登入。
mutation RequestPasswordReset($input: RequestPasswordResetInput!) {
  requestPasswordReset(input: $input) {
    success
  }
}

# 啟用信與重設信共用;成功直接回登入 token(refresh token 同 login 走 httpOnly cookie)
mutation SetPassword($input: SetPasswordInput!) {
  setPassword(input: $input) {
    accessToken
  }
}

# 已登入者改密碼;首登強改(mustChangePassword)也走此路,成功後旗標清除
mutation ChangePassword($input: ChangePasswordInput!) {
  changePassword(input: $input) {
    success
  }
}
