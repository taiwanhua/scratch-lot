# 組織管理(模組 system.org-manager,規則正本 docs/modules/org-manager.md)。
# 樹以操作者可見範圍決定(ADR-0005):根組織視角以根組織為根、租戶視角以租戶頂層為根;
# 可見範圍外的節點照樣回、標 outOfScope(樹不斷,但不能選也不能操作)。

# ownerUserId 只有租戶頂層有值(使用者管理頁靠它判斷哪一列是受保護的擁有者,不必逐筆查 org(id))
fragment OrgNodeFields on OrgNode {
  id
  name
  parentId
  enabled
  outOfScope
  ownerUserId
}

# 五層夠現行組織深度(根 > 租戶 > 部門 > 子部門 > 再一層);GraphQL 沒有遞迴 fragment,深度只能展開
query OrgTree {
  orgTree {
    ...OrgNodeFields
    children {
      ...OrgNodeFields
      children {
        ...OrgNodeFields
        children {
          ...OrgNodeFields
          children {
            ...OrgNodeFields
          }
        }
      }
    }
  }
}

# 業務頁的組織選擇器(OrgTreeSelect scope="visible"):操作者**可見範圍**內的組織,釘在當前組織的租戶;
# 只要登入、不要求治理權限(治理頁用上面的 orgTree = 管理範圍)。深度同 OrgTree
query VisibleOrgTree {
  visibleOrgTree {
    ...OrgNodeFields
    children {
      ...OrgNodeFields
      children {
        ...OrgNodeFields
        children {
          ...OrgNodeFields
          children {
            ...OrgNodeFields
          }
        }
      }
    }
  }
}

# 右側資料區;logoUrl 是現簽的短效網址(ADR-0010:DB 存路徑不存 URL),
# ownerUserId / visibility / slug / timezone 只在租戶頂層有值;timezone 為 null = 沒設、使用預設時區
query Org($id: ID!) {
  org(id: $id) {
    id
    name
    description
    parentId
    enabled
    isSystem
    ownerUserId
    visibility
    timezone
    slug
    logoUrl
  }
}

mutation CreateChildOrg($input: CreateChildOrgInput!) {
  createChildOrg(input: $input) {
    org {
      id
      name
      description
      parentId
      enabled
    }
  }
}

# logoPath 只收 createUploadUrl 發出的物件路徑;給 null 代表清空描述 / 商標
mutation UpdateOrg($input: UpdateOrgInput!) {
  updateOrg(input: $input) {
    org {
      id
      name
      description
      logoUrl
    }
  }
}

# 停用連動整棵子樹;啟用只啟用自己這一節 → 成功後整棵樹要重查
mutation SetOrgEnabled($input: SetOrgEnabledInput!) {
  setOrgEnabled(input: $input) {
    org {
      id
      enabled
    }
  }
}

# 限同租戶(CROSS_TENANT)、不可搬進自己的子樹(CYCLIC_MOVE)
mutation MoveOrg($input: MoveOrgInput!) {
  moveOrg(input: $input) {
    org {
      id
      parentId
    }
  }
}

# 前置四項不過 → ORG_NOT_DELETABLE,errors[0].extensions.reasons 逐項列出原因
mutation DeleteOrg($input: DeleteOrgInput!) {
  deleteOrg(input: $input) {
    success
    deletedId
  }
}

# --- 租戶作業(模組 system.org-manager.tenant-ops,根組織專屬) ---
# 三個 mutation 的彈窗都開在組織管理頁上,但權限屬 tenant-ops;
# 非根組織的操作者即使持有權限也會拿到 FORBIDDEN(ADR-0009)。

# 開通彈窗的模組勾選清單 = 租戶管理員模板綁的模組(根組織專屬模組不在其中),前端預設全勾;
# parentId 為 null 代表上層不在清單內,該節點在勾選樹上自成一棵根
query TenantModuleOptions {
  tenantModuleOptions {
    id
    key
    name
    parentId
    sidebarType
    order
  }
}

# ADR-0009 四步 + 擁有者一個交易完成,啟用信在交易提交後寄;logoPath 只收 createUploadUrl 發出的物件路徑。
# moduleKeys 不在 tenantModuleOptions 內(含根組織專屬模組)或一個都沒勾、slug 格式不符
# (^[a-z][a-z0-9_]{1,19}$)或已被用 → VALIDATION_FAILED,
# errors[0].extensions.fields 指出是哪一欄。成功後組織樹要重查(多一個租戶節點)
mutation ProvisionTenant($input: ProvisionTenantInput!) {
  provisionTenant(input: $input) {
    org {
      id
      name
      parentId
      enabled
      ownerUserId
      visibility
      slug
      logoUrl
    }
    ownerUserId
    roleId
    moduleKeys
    # 交易提交後才寄;false = 開通已成立但啟用信沒寄出,請首任管理員用「忘記密碼」
    activationMailSent
  }
}

# 撤銷開通(根組織專屬):反向抹掉開通建出的租戶頂層、擁有者帳號、租戶管理員副本。
# 租戶底下還有別的東西 → PROVISION_NOT_REVOKABLE,errors[0].extensions.reasons 逐項列出
# (語彙同 ORG_NOT_DELETABLE)。成功後組織樹要重查(少一個租戶節點),選取要清掉
mutation RevokeTenantProvision($input: RevokeTenantProvisionInput!) {
  revokeTenantProvision(input: $input) {
    success
    revokedOrgId
    revokedOwnerUserId
    revokedRoleId
  }
}

# 編輯租戶頂層時的「擁有者」欄位;轉移後擁有者保護的對象隨之換人
mutation TransferOrgOwner($input: TransferOrgOwnerInput!) {
  transferOrgOwner(input: $input) {
    org {
      id
      ownerUserId
    }
  }
}

# 編輯租戶頂層時的「使用者可見下層組織資料」開關(ADR-0005);只掛租戶頂層、套用整棵子樹
mutation SetOrgVisibility($input: SetOrgVisibilityInput!) {
  setOrgVisibility(input: $input) {
    org {
      id
      visibility
    }
  }
}

# 編輯租戶頂層時的「時區」欄;只掛租戶頂層、整個租戶共用。timezone 給 null = 清除、退回預設時區;
# 不是 Intl 認得的 IANA 名稱 → VALIDATION_FAILED(extensions.fields = ["timezone"])
mutation SetOrgTimezone($input: SetOrgTimezoneInput!) {
  setOrgTimezone(input: $input) {
    org {
      id
      timezone
    }
  }
}

# --- 成員頁籤(權限 system.org-manager.view-members / .add-members) ---
# 清單是這個組織**自己**的成員(org_user 直接關聯),不含下層組織的成員 ——
# 「加入成員」加的就是一筆直接關聯,列表要跟它對得起來;要看整棵子樹是使用者管理的 users。
# otherOrgs = 這位成員在本組織以外的所屬組織,只列操作者管理範圍內的(範圍外不露名稱也不露 id)。
fragment OrgMemberFields on OrgMember {
  id
  account
  name
  enabled
  otherOrgs {
    id
    name
  }
}

query OrgMembers($orgId: ID!, $input: OrgMembersInput!) {
  orgMembers(orgId: $orgId, input: $input) {
    totalCount
    page
    pageSize
    items {
      ...OrgMemberFields
    }
  }
}

# 「加入成員」彈窗的候選:管理範圍內、**尚未加入**這個組織的使用者。
# 守在 add-members 底下,不借 users —— 借了會讓這個彈窗連帶需要 system.user-manager.view。
query OrgMemberCandidates($orgId: ID!, $input: OrgMembersInput!) {
  orgMemberCandidates(orgId: $orgId, input: $input) {
    totalCount
    page
    pageSize
    items {
      ...OrgMemberFields
    }
  }
}

# 增量加入(不是全量覆蓋);已經是成員的回在 skippedUserIds(冪等,不報錯)。
# 寫入與稽核沿用使用者管理的所屬組織那一支(user.add-org);移除成員仍走使用者管理的「選擇所屬組織」。
# 成功後要把 orgMembers / orgMemberCandidates 都失效重查
mutation AddOrgMembers($input: AddOrgMembersInput!) {
  addOrgMembers(input: $input) {
    addedUserIds
    skippedUserIds
  }
}

# 組織的主管(`org_manager`,審核流程的「主管」來源從提交組織往上找它);
# 獨立一支查詢,只有組織管理頁的詳情 / 編輯用得到,不讓每一次 org(id) 都多查一次
fragment UserSummaryFields on UserSummary {
  id
  name
  account
  enabled
}

query OrgManagers($id: ID!) {
  org(id: $id) {
    id
    managers {
      ...UserSummaryFields
    }
  }
}

# 主管候選人:該組織所屬租戶裡啟用中的使用者(關鍵字比對姓名 / 帳號,最多 50 位)
query OrgManagerCandidates($orgId: ID!, $keyword: String) {
  orgManagerCandidates(orgId: $orgId, keyword: $keyword) {
    ...UserSummaryFields
  }
}

# 整組取代主管(稽核 org.set-managers);回傳帶新的主管名單,直接換掉快取
mutation SetOrgManagers($input: SetOrgManagersInput!) {
  setOrgManagers(input: $input) {
    org {
      id
      managers {
        ...UserSummaryFields
      }
    }
  }
}
