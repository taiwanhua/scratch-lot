# 欄位管理(模組 system.field-manager,規則正本 docs/modules/field-manager.md)。
# 合併清單 = 全域種子 + 上層組織自訂 + 當前組織自訂 + 可見範圍內的下層自訂,每筆帶:
# ownerOrg(null = 全域種子,有值 = 加這筆的組織)、isOwn(是不是自己這一層加的)、
# canEdit / canToggleEnabled(api 依操作者算好,前端只讀、不再自己推視角)。

fragment FieldFields on Field {
  id
  categoryId
  label
  value
  order
  enabled
  description
  ownerOrg {
    id
    name
  }
  isOwn
  canEdit
  canToggleEnabled
}

fragment FieldCategoryFields on FieldCategory {
  id
  key
  name
  description
  isSystem
  enabled
}

# 類別清單(全域;seed 宣告的系統類別 isSystem = true + root 在畫面新增的)。
# FieldCategoriesInput: { enabledOnly }(缺席 = 全部,欄位管理頁;true = 只列啟用,表單設計器的類別下拉)
query FieldCategories($input: FieldCategoriesInput) {
  fieldCategories(input: $input) {
    items {
      ...FieldCategoryFields
    }
    totalCount
  }
}

# 以下三個是類別作業(system.field-manager.category-ops.manage-categories,限站在根組織;
# 非根組織 → FORBIDDEN reason ROOT_ONLY)。類別不可刪。
# CreateFieldCategoryInput: { key, name, description }
# key 格式不符 → VALIDATION_FAILED(fields ["key"]);已存在(含停用的)→ FIELD_CATEGORY_KEY_DUPLICATE
mutation CreateFieldCategory($input: CreateFieldCategoryInput!) {
  createFieldCategory(input: $input) {
    category {
      ...FieldCategoryFields
    }
  }
}

# UpdateFieldCategoryInput: { id, name, description };key 不在 input 內(建立後不可改)。
# name 缺席 = 不動;description 缺席 = 不動、null = 清空;系統類別 → FORBIDDEN reason SYSTEM_CATEGORY
mutation UpdateFieldCategory($input: UpdateFieldCategoryInput!) {
  updateFieldCategory(input: $input) {
    category {
      ...FieldCategoryFields
    }
  }
}

# SetFieldCategoryEnabledInput: { id, enabled };系統類別停用 → FORBIDDEN reason SYSTEM_CATEGORY
mutation SetFieldCategoryEnabled($input: SetFieldCategoryEnabledInput!) {
  setFieldCategoryEnabled(input: $input) {
    category {
      ...FieldCategoryFields
    }
  }
}

# 右側選項表格;已依 order 再依組織深度排好
query Fields($categoryId: ID!) {
  fields(categoryId: $categoryId) {
    items {
      ...FieldFields
    }
    totalCount
  }
}

# 新增自訂選項:orgId 不由前端給(= 當前組織);
# value 與同類別的上層繼承鏈(全域 / 上層組織自訂 / 自己)重複 → FIELD_VALUE_DUPLICATE,標在「值」欄位
mutation CreateField($input: CreateFieldInput!) {
  createField(input: $input) {
    field {
      ...FieldFields
    }
  }
}

# 編輯自訂選項;value 不可改(不在 input 內)。
# 種子選項 → FORBIDDEN(reason SEED_READ_ONLY);別層組織加的 → FORBIDDEN(reason NOT_OWNER)。
# 缺席 / null 語意(GQL-06):label / order 缺席 = 不動;description 缺席 = 不動、null = 清空
mutation UpdateField($input: UpdateFieldInput!) {
  updateField(input: $input) {
    field {
      ...FieldFields
    }
  }
}

# 停用 / 啟用;種子選項的 enabled 是全域開關,只有根組織操作者切得動
# (否則 FORBIDDEN,reason SEED_GLOBAL_SWITCH);別層組織加的 → reason NOT_OWNER
mutation SetFieldEnabled($input: SetFieldEnabledInput!) {
  setFieldEnabled(input: $input) {
    field {
      ...FieldFields
    }
  }
}
