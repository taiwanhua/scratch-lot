# 模組與權限(api 正本 apps/api/src/modules/、規則正本 docs/modules/module-manager.md)。
# 根組織專屬(ADR-0009):當前組織不是根組織 → 四個端點一律 FORBIDDEN,即使持有權限。
# 與 me.modules 的差別:這裡是治理面的「平台宣告了什麼」— 全樹照回,含側欄看不到的 hidden
# 節點與隱藏的 api 權限樹,也含**已停用**的模組與權限(狀態一律以 enabled 表示,不以「不回」表示)。

fragment ModuleAdminNodeFields on ModuleAdminNode {
  id
  key
  name
  parentId
  sidebarType
  # 只有自己那一段(不是完整路徑);null = 不對應畫面 ⇒ hidden + route 為 null 就是權限容器
  route
  order
  description
  # 側欄圖示 key(白名單 @repo/domain/module-icon);null = 用預設圖示
  icon
  enabled
  # FORM = 表單模組(頁面由表單引擎組裝,右側多一塊「列表欄位配置」)
  engine
  permissions {
    id
    key
    name
    description
    enabled
  }
}

# GraphQL 沒有遞迴 fragment,深度只能展開;五層夠現行模組樹
#(最深四層:demo > demo.sub > demo.sub.sample-one > demo.sub.sample-one.view-page)
query ModuleTree {
  moduleTree {
    ...ModuleAdminNodeFields
    children {
      ...ModuleAdminNodeFields
      children {
        ...ModuleAdminNodeFields
        children {
          ...ModuleAdminNodeFields
          children {
            ...ModuleAdminNodeFields
          }
        }
      }
    }
  }
}

# 停用連動整棵子樹(子孫的 enabled 一併落庫成 false);啟用只啟用自己這一節。
# 回傳被切換的模組**及其整棵子樹**的最新狀態,前端直接換掉樹上的這一枝。
mutation SetModuleEnabled($input: SetModuleEnabledInput!) {
  setModuleEnabled(input: $input) {
    module {
      ...ModuleAdminNodeFields
      children {
        ...ModuleAdminNodeFields
        children {
          ...ModuleAdminNodeFields
          children {
            ...ModuleAdminNodeFields
          }
        }
      }
    }
  }
}

# 模組的側欄圖示(根組織專屬):icon 必須是白名單 @repo/domain/module-icon 的 key,
# 否則 VALIDATION_FAILED(extensions.fields = ["icon"]);icon: null(或不送)= 清回預設圖示。
# 不連動、不自鎖 — 換圖示只影響長相,回的是這個模組這一枝的最新狀態(與 SetModuleEnabled 同 payload)。
mutation SetModuleIcon($input: SetModuleIconInput!) {
  setModuleIcon(input: $input) {
    module {
      ...ModuleAdminNodeFields
      children {
        ...ModuleAdminNodeFields
        children {
          ...ModuleAdminNodeFields
          children {
            ...ModuleAdminNodeFields
          }
        }
      }
    }
  }
}

# 全域 kill switch:停用後任何人都不再持有這筆權限,連超級管理員也不給(ADR-0011 步驟 4)。
# 不連動任何東西 — 權限沒有樹。
mutation SetPermissionEnabled($input: SetPermissionEnabledInput!) {
  setPermissionEnabled(input: $input) {
    permission {
      id
      key
      name
      description
      enabled
    }
  }
}
