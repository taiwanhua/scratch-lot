# 資料範圍(#205;api 正本 apps/api/src/data-scope/、規則正本 docs/adr/0008-data-scope.md)。
# 根組織專屬模組:站在租戶裡即使持有權限,api 也回 FORBIDDEN。
# fields 已含底座自動掛入的基礎欄位(isBase = true:組織 / 建立者 / 更新者 / 建立、更新、刪除時間)。
# 型別決定 UI:org / user → in、not-in(可選動態值);date → between / before / after;enum → in、not-in。
# date 的值與表單引擎的日期存值同一種:選的那一天在規則所屬組織(根組織;本頁只有根組織進得來,= me.currentOrg.timezone)租戶時區 00:00 的時點,
# 送帶時區的 ISO 8601 字串;`YYYY-MM-DD` 會被拒(VALUE_INVALID)。比對是日曆天、逐租戶套用:api 以根組織的時區還原那一天,再以操作者租戶的時區算整天的邊界。
# hasRule = 這個目標已設規則(有規則文件且 rules 非空);語意正本見 docs/modules/data-scope.md 的 api 介面節。
# 一列 = 一個模組:目標以 (collection, moduleKey) 為識別鍵,同一張表(form_submissions)可以有多個模組各一列;
# 讀寫規則都以 id 指定目標。

query DataScopeTargets {
  dataScopeTargets {
    targets {
      id
      collection
      moduleKey
      moduleName
      name
      description
      hasRule
      fields {
        name
        label
        type
        isBase
        options {
          value
          label
        }
      }
    }
  }
}

# rule = null 代表這個目標尚無規則(查詢只受租戶保底);rules[].filter 是條件樹 JSON,形狀見 api 正本;
# rules[].audience 是人員條件 JSON({ mode: "all" } | { mode: "match", filter }),形狀正本 @repo/domain/audience
query DataScopeRule($targetId: ID!) {
  dataScopeRule(targetId: $targetId) {
    rule {
      targetId
      collection
      moduleKey
      combineOp
      updatedAt
      rules {
        audience
        filter
      }
    }
  }
}

# 整份覆蓋:送出的就是之後生效的全部;rules 給空陣列 = 刪掉這個目標的規則
# 不合法 → RULE_INVALID,extensions.path 指到出問題的節點、extensions.reason 是原因列舉
mutation SaveDataScopeRule($input: SaveDataScopeRuleInput!) {
  saveDataScopeRule(input: $input) {
    rule {
      targetId
      collection
      moduleKey
      combineOp
      updatedAt
      rules {
        audience
        filter
      }
    }
  }
}
