# 示範模組1(模組 demo.sub.sample-one,規則正本 docs/modules/demo.sub.sample-one.md)。
#
# 三件事在這裡就要看得懂:
# 1. `internalNote` 是**欄位級權限**欄:沒有 `demo.sub.sample-one.show-internal-note` 時
#    api 不把這個欄位放進回傳物件(序列化成 null)。「沒權限」與「沒填」在值上看起來一樣,
#    所以**前端用自己的權限集決定要不要渲染這個欄位**,不要拿值去猜。
# 2. `abilities` 由 api 依操作者權限算好,而且**已經含權限判斷** —— 前端直接用,
#    不要再與 usePermissions 相乘(同一條規則兩邊各算一次,對不起來就是畫面與 API 不一致)。
# 3. 封面與附件走**不同的路**(ADR-0010):`coverUrl` 是公開穩定 URL(直接放 img src),
#    附件只給路徑與原始檔名 / 大小 / 檔型,要下載時才呼叫 `DemoItemOneAttachmentUrl` 現簽
#    (短效,不要當成穩定連結快取)。

fragment DemoItemOneFields on DemoItemOne {
  id
  name
  category
  categoryLabel
  note
  internalNote
  coverPath
  coverUrl
  # name / size / contentType 是上傳時申報的原始值;早期的舊資料三者為 null
  # → 顯示時檔名退回路徑尾段、不顯示大小
  attachment {
    path
    name
    size
    contentType
  }
  status
  enabled
  # 建立者查不到那位使用者時是 null(seed 示範資料用假 ObjectId;使用者也可能已被刪除)→ 顯示「—」
  createdBy {
    id
    name
  }
  createdAt
  updatedAt
  abilities {
    canEdit
    canDelete
    canEditInternalNote
  }
}

# 列表:keyword 比對名稱與備註(**不比對內部備註**)、category 是欄位管理「示範分類」的選項 value、
# enabled 缺席 = 啟用與停用都回。範圍(可見範圍 + 資料範圍規則)由 api 自動套,前端不送組織條件。
query DemoItemsOne($input: DemoItemsOneInput!) {
  demoItemsOne(input: $input) {
    items {
      ...DemoItemOneFields
    }
    totalCount
    page
    pageSize
  }
}

# 單筆(詳情頁 / 編輯頁);看不到的資料一律 NOT_FOUND,不透露它存在
query DemoItemOne($id: ID!) {
  demoItemOne(id: $id) {
    item {
      ...DemoItemOneFields
    }
  }
}

# 變更歷程區塊(編輯頁自有權限 demo.sub.sample-one.edit-page.show-history);
# 與「能不能編輯」互相獨立。`before` / `after` 只有有變的欄位;
# internalNote 一律記成 "[redacted]"(歷程不外流內部備註的內容)
query DemoItemOneHistory($id: ID!) {
  demoItemOneHistory(id: $id) {
    items {
      id
      action
      actor {
        id
        name
      }
      before
      after
      createdAt
    }
    totalCount
  }
}

# 私有附件的下載網址(需 demo.sub.sample-one.view);按下下載才要,不要預先取來放著
query DemoItemOneAttachmentUrl($id: ID!) {
  demoItemOneAttachmentUrl(id: $id) {
    url
  }
}

# CreateDemoItemOneInput: { name, category?, status?, note?, internalNote?, coverPath?, attachment? }
# 新增:coverPath 是 createUploadUrl(purpose DEMO_COVER)回的 objectPath;attachment 是
# { path, name, size, contentType }(DemoItemOneAttachmentInput:DEMO_ATTACHMENT 的 objectPath +
# File.name / File.size / File.type);沒有 edit-internal-note 就**不要送 internalNote 這個欄位**
# (送了、即使是 null,也會 FORBIDDEN 且 extensions.reason = FIELD_FORBIDDEN)
mutation CreateDemoItemOne($input: CreateDemoItemOneInput!) {
  createDemoItemOne(input: $input) {
    item {
      ...DemoItemOneFields
    }
  }
}

# UpdateDemoItemOneInput: { id, name?, category?, status?, note?, internalNote?, coverPath?, attachment? }
# 編輯:缺席 = 不動、null = 清空(GQL-06);name / status 送 null 視同缺席。
# 封面 / 附件「不換檔」就不放那個欄位,換檔送新的 coverPath / attachment,要清掉就送 null
mutation UpdateDemoItemOne($input: UpdateDemoItemOneInput!) {
  updateDemoItemOne(input: $input) {
    item {
      ...DemoItemOneFields
    }
  }
}

# 刪除(軟刪除);回 deletedId 讓前端把那一列從快取拿掉
mutation DeleteDemoItemOne($input: DeleteDemoItemOneInput!) {
  deleteDemoItemOne(input: $input) {
    success
    deletedId
  }
}

# 列表的停用 / 啟用切換(需 demo.sub.sample-one.edit);隨時切得回來,不套自鎖保護
mutation SetDemoItemOneEnabled($input: SetDemoItemOneEnabledInput!) {
  setDemoItemOneEnabled(input: $input) {
    item {
      ...DemoItemOneFields
    }
  }
}
