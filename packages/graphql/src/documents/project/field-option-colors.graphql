# 欄位選項顏色(S2 專案客製,規格 18.5;正本 docs/modules/project/field-manager.md「選項顏色」)。
# paletteKey = 色票代號(@repo/domain/project/tag-palette);顏色值由 admin 的 lib/project/tag-palettes.ts 依代號取。

fragment FieldOptionColorFields on FieldOptionColor {
  fieldId
  value
  paletteKey
}

# 一個類別(以 key 指定)合併清單裡有顏色的選項;只要登入即可讀(顯示選項的頁面都要用)。
query FieldOptionColors($categoryKey: String!) {
  fieldOptionColors(categoryKey: $categoryKey) {
    items {
      ...FieldOptionColorFields
    }
    totalCount
  }
}

# 設定 / 清掉一個選項的顏色(paletteKey null = 清掉);限能停用 / 啟用該選項的那一層。
mutation SetFieldOptionColor($input: SetFieldOptionColorInput!) {
  setFieldOptionColor(input: $input) {
    color {
      ...FieldOptionColorFields
    }
  }
}
