fragment LotteryStoreScanItemFields on LotteryStoreScanItem {
  ticketId
  version
  bookId
  gameCode
  gameName
  unitPrice
  bookNo
  ticketNo
  status
  locationKind
  cashPoint {
    ...LotteryAccountsRefFields
  }
  counterShiftOwner {
    ...LotteryAccountsRefFields
  }
  responsibleOrg {
    ...LotteryAccountsRefFields
  }
  outcome
  blockReason
  soldAt
  pendingSkipCount
  unmatched
  match
}

fragment LotteryStoreSaleFields on LotteryStoreSale {
  ticketId
  version
  ticketKey
  amount
  soldAt
  cashPoint {
    ...LotteryAccountsRefFields
  }
  shiftId
  undone
  undoBlock
  matched
  countSale {
    refId
    gameId
    gameCode
    gameName
    unitPrice
    count
    undoneCount
    undoableCount
  }
}

fragment LotteryStoreCardTicketFields on LotteryStoreCardTicket {
  id
  ticketNo
  version
  status
  locationKind
  cashPoint {
    ...LotteryAccountsRefFields
  }
  soldShiftId
  soldSource
  locked
  unmatched
}

fragment LotteryStoreBookCardFields on LotteryStoreBookCard {
  bookId
  gameCode
  gameName
  unitPrice
  bookNo
  firstTicketNo
  lastTicketNo
  pendingSkipCount
  pendingSkipTotal
  unopened
  unmatchedCount
  tickets {
    ...LotteryStoreCardTicketFields
  }
}

fragment LotteryStoreStockBookFields on LotteryStoreStockBook {
  bookId
  gameCode
  gameName
  unitPrice
  bookNo
  firstTicketNo
  lastTicketNo
  ticketCount
  pendingSkipCount
  sealed
  pendingSkipTotal
}

query LotteryStoreScan($input: LotteryStoreScanInput!) {
  lotteryStoreScan(input: $input) {
    items {
      ...LotteryStoreScanItemFields
    }
  }
}

mutation SellLotteryTickets($input: SellLotteryTicketsInput!) {
  sellLotteryTickets(input: $input) {
    items {
      ...LotteryStoreSaleFields
    }
  }
}

query LotteryStoreSale($ticketId: ID!) {
  lotteryStoreSale(ticketId: $ticketId) {
    item {
      ...LotteryStoreSaleFields
    }
  }
}

query LotteryStoreRecentSales($shiftId: ID!) {
  lotteryStoreRecentSales(shiftId: $shiftId) {
    items {
      ...LotteryStoreSaleFields
    }
  }
}

mutation SellLotteryTicketsByCount($input: SellLotteryTicketsByCountInput!) {
  sellLotteryTicketsByCount(input: $input) {
    items {
      refId
      gameId
      gameCode
      gameName
      unitPrice
      count
      amount
    }
  }
}

mutation UndoLotteryCountSale($input: UndoLotteryCountSaleInput!) {
  undoLotteryCountSale(input: $input) {
    item {
      ...LotteryStoreSaleFields
    }
  }
}

mutation UndoLotteryTicketSale($input: UndoLotteryTicketSaleInput!) {
  undoLotteryTicketSale(input: $input) {
    item {
      ...LotteryStoreSaleFields
    }
  }
}

query LotteryStoreBookCard($orgId: ID!, $bookId: ID!) {
  lotteryStoreBookCard(orgId: $orgId, bookId: $bookId) {
    item {
      ...LotteryStoreBookCardFields
    }
  }
}

query LotteryStoreStockBooks($orgId: ID!) {
  lotteryStoreStockBooks(orgId: $orgId) {
    items {
      ...LotteryStoreStockBookFields
    }
  }
}

mutation SplitLotteryBook($input: SplitLotteryBookInput!) {
  splitLotteryBook(input: $input) {
    count
  }
}

mutation MoveLotteryTickets($input: MoveLotteryTicketsInput!) {
  moveLotteryTickets(input: $input) {
    count
  }
}

mutation RecallLotteryTickets($input: RecallLotteryTicketsInput!) {
  recallLotteryTickets(input: $input) {
    count
  }
}

# 依張數移櫃(張數店規格 7.7)
mutation MoveLotteryTicketsByCount($input: MoveLotteryTicketsByCountInput!) {
  moveLotteryTicketsByCount(input: $input) {
    count
  }
}

# [收回] / [刷條碼移櫃] 刷到一張(張數店規格 13.1)
query LotteryStoreCounterScan($input: LotteryStoreCounterScanInput!) {
  lotteryStoreCounterScan(input: $input) {
    items {
      ticketId
      version
      bookId
      gameId
      gameCode
      gameName
      bookNo
      ticketNo
      status
      unmatched
      cashPoint {
        id
        name
      }
      soldAt
      problem
      match
    }
  }
}
