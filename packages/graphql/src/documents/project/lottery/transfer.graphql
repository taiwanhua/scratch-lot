# 調貨單(模組 purchasing.transfer,正本 docs/modules/project/purchasing.md「調貨單」)。
# 調貨單本身的新增 / 存草稿 / 送出 / 審核 / 作廢走表單引擎;收付走 accounts.graphql 的收付端點。

fragment LotteryTransferReceivingFields on LotteryTransferReceiving {
  submissionId
  fromBranchName
  toBranchName
  transferAmount
  canReceive
  receivedCount
  totalCount
  rows {
    rowId
    bookId
    gameCode
    gameName
    bookNo
    mode
    ticketNos
    tickets
    amount
    rate
    purchaseAmount
    shipped
    received
    receivedTickets
    receivedAt
    shippedAt
    batchId
    receivedTicketNos
  }
  batches {
    batchId
    no
    completedAt
    rowIds
    rows {
      rowId
      ticketNos
    }
  }
}

# submissionId:編輯中的那張調貨單(叫貨單清單另含它已引用的那張);新增頁不給
query LotteryTransferOptions($fromOrgId: ID!, $toOrgId: ID, $submissionId: ID) {
  lotteryTransferOptions(
    fromOrgId: $fromOrgId
    toOrgId: $toOrgId
    submissionId: $submissionId
  ) {
    books {
      bookId
      gameId
      gameCode
      gameName
      bookNo
      unitPrice
      bookPrice
      rate
      isWhole
      availableCount
      lastTicketNo
    }
    requisitions {
      id
      serialNo
      books
    }
    allocations {
      gameId
      plannedBooks
      givenBooks
      inTransitBooks
    }
  }
}

query LotteryTransferBookTickets($fromOrgId: ID!, $bookId: ID!) {
  lotteryTransferBookTickets(fromOrgId: $fromOrgId, bookId: $bookId) {
    ticketNo
    state
  }
}

query LotteryTransferProgress($transferIds: [ID!]!) {
  lotteryTransferProgress(transferIds: $transferIds) {
    transferId
    wholeBooks
    partialTickets
    receivedCount
    totalCount
    inTransit
    settlementKind
    settlementAmount
    inSettlement
  }
}

query LotteryTransferReceiving($submissionId: ID!) {
  lotteryTransferReceiving(submissionId: $submissionId) {
    ...LotteryTransferReceivingFields
  }
}

# ReceiveLotteryTransferBookInput: { submissionId, code, gameId? }(gameId = 同本號多款遊戲時選的遊戲)
mutation ReceiveLotteryTransferBook($input: ReceiveLotteryTransferBookInput!) {
  receiveLotteryTransferBook(input: $input) {
    rowId
    ticketNos
    receiving {
      ...LotteryTransferReceivingFields
    }
  }
}

# 選張的列在格子上點收(點選格子 / 其餘全部到齊):{ submissionId, rowId, ticketNos }
mutation ReceiveLotteryTransferTickets(
  $input: ReceiveLotteryTransferTicketsInput!
) {
  receiveLotteryTransferTickets(input: $input) {
    rowId
    ticketNos
    receiving {
      ...LotteryTransferReceivingFields
    }
  }
}

# [完成這次點收]:rowIds = 這一次點收的列(上次完成或打開頁面之後點收的)
mutation CompleteLotteryTransferReceiving(
  $input: CompleteLotteryTransferReceivingInput!
) {
  completeLotteryTransferReceiving(input: $input) {
    batch {
      batchId
      no
      completedAt
      rowIds
      rows {
        rowId
        ticketNos
      }
    }
    receiving {
      ...LotteryTransferReceivingFields
    }
    receiptLinks {
      ...LotteryReceiptLinksFields
    }
  }
}

mutation NotifyLotteryTransferWrongStore(
  $input: ReceiveLotteryTransferBookInput!
) {
  notifyLotteryTransferWrongStore(input: $input)
}
