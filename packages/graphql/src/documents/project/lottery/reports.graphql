# 輸出報表:營運報表、班次結帳歷史報表(專案規格第 11 章;正本 docs/modules/project/reports.md)

fragment LotteryReportQtyFields on LotteryReportQty {
  count
  amount
}

fragment LotteryReportStorePeriodFields on LotteryReportStorePeriod {
  orgId
  from
  to
  alignment
}

# LotteryOperationsReportInput: { periodKind, from, to, orgIds, alignDailyClose? }
query LotteryOperationsReport($input: LotteryOperationsReportInput!) {
  lotteryOperationsReport(input: $input) {
    closedThrough
    canShowCost
    stores {
      orgId
      period {
        ...LotteryReportStorePeriodFields
      }
      sales {
        scan {
          ...LotteryReportQtyFields
        }
        manual {
          reasonKey
          reason
          count
          amount
        }
        stocktake {
          ...LotteryReportQtyFields
        }
        undo {
          ...LotteryReportQtyFields
        }
        net {
          ...LotteryReportQtyFields
        }
        cost
        games {
          gameId
          gameCode
          gameName
          unitPrice
          sold
          undone
          netAmount
          cost
        }
      }
      redemption {
        valid {
          ...LotteryReportQtyFields
        }
        inStore {
          ...LotteryReportQtyFields
        }
        sent {
          ...LotteryReportQtyFields
        }
        revoked {
          ...LotteryReportQtyFields
        }
      }
      inventory {
        openingTickets
        openingCost
        purchaseBooks
        purchaseVoidBooks
        purchaseTickets
        purchaseCost
        transferInTickets
        transferInAmount
        transferOutTickets
        transferOutCost
        transferOutAmount
        transferGain
        salesTickets
        salesCost
        scrapTickets
        scrapCost
        newInvestigatingTickets
        newInvestigatingCost
        investigateRecoveredTickets
        investigateRecoveredCost
        lostRecoveredTickets
        lostRecoveredCost
        pendingAdjustTickets
        pendingAdjustCost
        endingTickets
        endingCost
        checkTickets
        checkCost
        inTransitTickets
        inTransitAmount
        investigatingTickets
        investigatingCost
        investigatingBooks
        investigatingBookIds
        lostTickets
        lostCost
        skippedTickets
      }
      cash {
        shiftCount
        pendingShiftCount
        shiftDifference
        postClose {
          category
          count
          amount
        }
        dailyCloseCount
        vaultDifference
        movements {
          type
          count
          drawer
          vault
        }
      }
      bankAccounts {
        accountId
        label
        shared
        types {
          type
          inAmount
          outAmount
          reversalCount
        }
        endingBalance
      }
      outstanding {
        items {
          kind
          count
          amount
          serialNos
        }
      }
      notes {
        skippedStocktakes {
          reason
          count
        }
        uncountedStocktakes
        uncountedBooks
        uncoveredShifts
        uncoveredShiftLabels
        priorPeriodCount
        priorPeriodAmount
        openMonths
      }
    }
  }
}

# 條件畫面:對齊日結的逐店實際期間、已關帳到哪
query LotteryOperationsReportPeriods($input: LotteryOperationsReportInput!) {
  lotteryOperationsReportPeriods(input: $input) {
    closedThrough
    stores {
      ...LotteryReportStorePeriodFields
    }
  }
}

# LotteryShiftCheckoutsReportInput: { periodKind, from, to, orgIds, cashPointId?, onlyWithDifference? }
query LotteryShiftCheckoutsReport($input: LotteryShiftCheckoutsReportInput!) {
  lotteryShiftCheckoutsReport(input: $input) {
    rows {
      checkoutId
      orgId
      cashPointId
      cashPointName
      openedAt
      submittedAt
      leader
      helpers
      taskRole
      taskPosition
      taskName
      expected
      counted
      difference
      diffReason
      postClose
      postCloseEntries {
        category
        amount
        recordedAt
        priorPeriod
      }
      stocktakeMode
      skipReason
      uncountedBooks
      status
    }
  }
}

# 條件的收銀點下拉(LotteryReportRangeInput: { periodKind, from, to, orgIds })
query LotteryShiftCheckoutsReportCashPoints($input: LotteryReportRangeInput!) {
  lotteryShiftCheckoutsReportCashPoints(input: $input) {
    id
    orgId
    name
  }
}
