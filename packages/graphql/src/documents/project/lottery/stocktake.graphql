fragment LotteryStocktakeShiftFields on LotteryStocktakeShift {
  id
  ownerName
  openedAt
  closed
  expectedCash
}

fragment LotteryStocktakeSummaryFields on LotteryStocktakeSummary {
  books
  backfillCount
  backfillAmount
  newInvestigate
  flagged
  confirmLost
  confirmLostCost
  uncountedCount
}

query LotteryStocktakeSheet($input: LotteryStocktakeSheetInput!) {
  lotteryStocktakeSheet(input: $input) {
    orgId
    orgName
    serverNow
    cashPoints {
      id
      name
      shift {
        ...LotteryStocktakeShiftFields
      }
      lastShift {
        ...LotteryStocktakeShiftFields
      }
    }
    books {
      bookId
      cashPointId
      gameCode
      gameName
      unitPrice
      bookNo
      tickets {
        ticketId
        ticketNo
        version
        status
        pendingReversal
      }
    }
    unopenedBooks {
      bookId
      gameCode
      gameName
      bookNo
      ticketCount
    }
    lostTickets {
      ticketId
      bookId
      gameCode
      bookNo
      ticketNo
      bookTicketCount
      since
      source
      gameId
      gameName
      unmatched
      sourceId
      sourceType
      sourceCashPointName
    }
    countMode
    countGroups {
      cashPointId
      gameId
      gameCode
      gameName
      unitPrice
      unsoldCount
      bookNos
    }
  }
}

query LotteryStocktakeReview($input: LotteryStocktakeReviewInput!) {
  lotteryStocktakeReview(input: $input) {
    staleCount
    unhandledCount
    uncountedCount
    countLines {
      cashPointId
      cashPointName
      gameId
      gameCode
      gameName
      unitPrice
      systemCount
      presentCount
      kind
      diffCount
      saleCount
      stale
      unhandled
    }
    summary {
      ...LotteryStocktakeSummaryFields
    }
    lines {
      bookId
      cashPointId
      cashPointName
      gameCode
      gameName
      bookNo
      unitPrice
      systemCount
      presentCount
      diffs {
        ticketId
        ticketNo
        version
        kind
        backfilled
      }
      pendingReversalTicketNos
      staleTicketNos
    }
  }
}

mutation BackfillLotteryStocktakeSales(
  $input: BackfillLotteryStocktakeSalesInput!
) {
  backfillLotteryStocktakeSales(input: $input) {
    items {
      ticketId
      ticketNo
      eventId
      amount
      cashPointId
      shiftId
      postClose
    }
  }
}

query LotteryStocktakeStatus($orgId: ID!) {
  lotteryStocktakeStatus(orgId: $orgId) {
    lastSubmittedAt
    remind
  }
}

query LotteryStocktakes($input: LotteryStocktakesInput!) {
  lotteryStocktakes(input: $input) {
    total
    items {
      id
      submissionId
      serialNo
      type
      status
      startedAt
      submittedAt
      summary {
        ...LotteryStocktakeSummaryFields
      }
    }
  }
}

query LotteryStocktake($submissionId: ID!) {
  lotteryStocktake(submissionId: $submissionId) {
    id
    submissionId
    type
    status
    orgId
    orgName
    scopeCashPoint {
      id
      name
    }
    startedAt
    submittedAt
    submittedBy {
      id
      name
    }
    confirmedAt
    lines {
      bookId
      cashPointId
      cashPointName
      gameCode
      gameName
      bookNo
      method
      countedAt
      systemCount
      presentCount
      diffs {
        ticketNo
        kind
        action
        postClose
        amount
      }
    }
    unopened {
      gameCode
      gameName
      bookNo
      ticketCount
      present
    }
    lostReview {
      label
      action
      reasonLabel
      reasonNote
    }
    uncountedBooks {
      bookId
      cashPointId
      cashPointName
      gameCode
      gameName
      bookNo
    }
    countMode
    countLines {
      cashPointId
      cashPointName
      gameCode
      gameName
      countedAt
      systemCount
      presentCount
      recounts
      saleCount
      saleAmount
      investigateCount
      flaggedCount
    }
    uncountedGroups {
      cashPointId
      cashPointName
      gameCode
      gameName
    }
    summary {
      ...LotteryStocktakeSummaryFields
    }
    draft
  }
}

mutation BackfillLotteryStocktakeCountSales(
  $input: BackfillLotteryStocktakeCountSalesInput!
) {
  backfillLotteryStocktakeCountSales(input: $input) {
    refId
    count
    amount
    shiftId
    postClose
  }
}

fragment LotteryStocktakeSessionFields on LotteryStocktakeSession {
  sessionId
  type
  wholeStore
  cashPointId
  cashPointName
  byId
  byName
  mine
  canEnd
  startedAt
  lastActiveAt
  expiresAt
  minutesLeft
  live
  ended
  draft
}

query LotteryStocktakeSessions($orgId: ID!) {
  lotteryStocktakeSessions(orgId: $orgId) {
    serverNow
    items {
      ...LotteryStocktakeSessionFields
    }
  }
}

mutation StartLotteryStocktakeSession(
  $input: StartLotteryStocktakeSessionInput!
) {
  startLotteryStocktakeSession(input: $input) {
    ...LotteryStocktakeSessionFields
  }
}

mutation SaveLotteryStocktakeSession(
  $input: SaveLotteryStocktakeSessionInput!
) {
  saveLotteryStocktakeSession(input: $input) {
    ...LotteryStocktakeSessionFields
  }
}

mutation EndLotteryStocktakeSession($input: EndLotteryStocktakeSessionInput!) {
  endLotteryStocktakeSession(input: $input)
}
