enum WorkflowInstanceStatus {
  APPROVED
  BLOCKED
  REJECTED
  RETURNED
  RUNNING
  SUPERSEDED
  WITHDRAWN
}

type WorkflowInstanceStepModel {
  allowReturn: Boolean!
  blocked: Boolean!
  decisions: [WorkflowDecisionModel!]!
  kind: String!
  mode: String
  name: String!
  plan: [WorkflowPlanItemModel!]!
  status: WorkflowStepStatus!
  stepKey: String!
}

type WorkflowInstancesPayload {
  items: [WorkflowInstanceModel!]!
  page: Int!
  pageSize: Int!
  totalCount: Int!
  truncated: Boolean!
}

type WorkflowIssueModel {
  code: String!
  edgeIndex: Int
  exprPath: String
  message: String!
  property: String
  stepIndex: Int
  stepKey: String
}

input WorkflowKeyInput {
  workflowKey: ID!
}

type WorkflowModel {
  abilities: WorkflowAbilities!
  assignments: [WorkflowAssignment!]!
  boundForms: [WorkflowBoundForm!]!
  createdAt: DateTime!
  currentVersion: Int
  forkedFrom: WorkflowForkSourceModel
  hasDraft: Boolean!
  hasRolePlaceholder: Boolean!
  id: ID!
  isShared: Boolean!
  key: ID!
  name: String!
  ownerOrgId: ID
  ownerOrgName: String
  publishInterrupted: Boolean!
  updatedAt: DateTime!
}

type WorkflowOutcomeModel {
  kind: String!
  stepKey: String!
  taskKey: String!
}

type WorkflowPayload {
  workflow: WorkflowModel!
}

type WorkflowPlanItemModel {
  assignee: FormUserRef!
  assigneeState: String!
  previousAssignees: [FormUserRef!]!
  taskId: ID
  taskKey: String!
}

"""關卡狀態:還沒進 / 跳過 / 進行中 / 完成 / 被終止"""
enum WorkflowStepStatus {
  ACTIVE
  COMPLETED
  PENDING
  SKIPPED
  TERMINATED
}

type WorkflowTaskModel {
  applicant: FormUserRef
  assignee: FormUserRef!
  comment: String
  createdAt: DateTime!
  decidedAt: DateTime
  editVersion: Int!
  formKey: ID!
  formName: String
  id: ID!
  instanceId: ID!
  instanceStatus: WorkflowInstanceStatus!
  moduleKey: String!
  moduleName: String
  revision: Int!
  status: WorkflowTaskStatus!
  stepKey: String!
  stepName: String!
  submissionId: ID!
  summary: FormSubmissionSummary
  taskKey: String!
}

type WorkflowTaskPayload {
  result: WorkflowDecideResult!
  task: WorkflowTaskModel!
}

"""任務狀態:待處理 / 核准 / 駁回 / 退回 / 晚到(不影響結果)/ 取消 / 承辦人失效"""
enum WorkflowTaskStatus {
  APPROVED
  BLOCKED
  CANCELLED
  LATE
  PENDING
  REJECTED
  RETURNED
}

type WorkflowTasksPayload {
  items: [WorkflowTaskModel!]!
  page: Int!
  pageSize: Int!
  totalCount: Int!
}

type WorkflowValidationReport {
  errors: [WorkflowIssueModel!]!
  warnings: [WorkflowIssueModel!]!
}

type WorkflowVersionModel {
  baseVersion: Int
  changelog: String
  checkFormKey: ID
  draftRevision: Int!
  edges: [WorkflowEdgeModel!]
  id: ID!
  publishedAt: DateTime
  publishedBy: FormUserRef
  status: WorkflowVersionStatus!
  steps: [JSONObject!]!
  version: Int
  workflowKey: ID!
}

type WorkflowVersionPayload {
  validation: WorkflowValidationReport
  workflowVersion: WorkflowVersionModel!
}

"""流程版本狀態:草稿 / 發布中 / 已發布 / 已退役"""
enum WorkflowVersionStatus {
  DRAFT
  PUBLISHED
  PUBLISHING
  RETIRED
}

type WorkflowVersionsPayload {
  items: [WorkflowVersionModel!]!
  totalCount: Int!
}

input WorkflowsInput {
  keyword: String
  page: Int = 1

  """每頁筆數,上限 100"""
  pageSize: Int = 20
}

type WorkflowsPayload {
  items: [WorkflowModel!]!
  page: Int!
  pageSize: Int!
  totalCount: Int!
}