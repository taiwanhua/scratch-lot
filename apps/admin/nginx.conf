server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback:所有路由都回 index.html,由前端 router 接手
  # index.html 指向帶 hash 的 bundle,絕不可被快取 —— 沒有 Cache-Control 時瀏覽器會用
  # 啟發式快取,部署後重新整理仍載入舊 HTML → 舊 bundle。
  # nginx 的 add_header 不會從上層繼承到「自己也有 add_header」的 block,
  # 所以 location / 與 location = /index.html 各寫一份(try_files 落到 /index.html
  # 是內部轉址,會重新比對 location,因此兩邊都要有)。
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # 帶 hash 的靜態資源可以永久快取
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
