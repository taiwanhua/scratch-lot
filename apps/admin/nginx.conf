server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback:所有路由都回 index.html,由前端 router 接手
  # index.html 指向帶 hash 的 bundle,絕不可被快取 —— 沒有 Cache-Control 時瀏覽器會用
  # 啟發式快取,部署後重新整理仍載入舊 HTML → 舊 bundle。
  # nginx 的 add_header 不會從上層繼承到「自己也有 add_header」的 block,
  # 所以 location / 與 location = /index.html 各寫一份(try_files 落到 /index.html
  # 是內部轉址,會重新比對 location,因此兩邊都要有)。
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # 可安裝 app 的 manifest(src/lib/base/web-app-manifest.ts):nginx 內建的 mime.types 沒有
  # webmanifest,不寫會以 application/octet-stream 送出。只在這個 location 清空 types 再給
  # default_type —— 在 server 層寫 `types { ... }` 會整個蓋掉內建對照表。
  # manifest 與 public/ 的圖示檔名固定、不帶 hash,和 index.html 一樣 no-cache(每次以 ETag 重新驗證),
  # 改了名稱或圖示,瀏覽器下次檢查就拿到新檔;不可搬進 /assets/(那裡是永久快取)。
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }

  # 版本檔(scripts/app-version-plugin.mjs):已開著的分頁回前景 / 換路由時抓它比對自己的版本,
  # 不同就提示重新整理。檔名固定、內容每次部署都變,和 index.html 一樣 no-cache,不可搬進 /assets/。
  location = /version.json {
    add_header Cache-Control "no-cache" always;
  }

  # 帶 hash 的靜態資源可以永久快取
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
}
