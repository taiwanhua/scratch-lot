# 容器名、volume 與網路由 Compose 依專案名管理(預設 = 這個資料夾的名稱;要改名在根 `.env` 設
# COMPOSE_PROJECT_NAME)。主機上的埠與 DB 名走 LOCAL_* 變數,範本與說明見根目錄 `.env.example`;
# 容器內部的埠固定不變。
services:
  # 單一成員 replica set:api 用交易(`TransactionService.withTransaction`),單節點 mongod 不支援。
  # 第一次起來由 healthcheck 執行 rs.initiate(之後 rs.status() 成功就只是健康檢查);
  # 成員位址登記成 localhost:27017,連線字串一律加 `directConnection=true`(容器內外、主機埠改過都連得到)。
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${LOCAL_MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 10

  # 以下兩個服務屬於 "full" profile:
  #   docker compose up -d                → 只起 mongo(日常開發)
  #   docker compose --profile full up -d → 整套容器化跑起來(部署前驗證)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["full"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/${LOCAL_MONGO_DB:-wowgo-base}?directConnection=true
      PORT: "5001"
      # 本機專用的固定值(api 沒有 JWT_SECRET 就起不來);雲端的值在 Secret Manager
      JWT_SECRET: local-dev-jwt-secret-change-me
    ports:
      - "${LOCAL_API_PORT:-5001}:5001"
    depends_on:
      mongo:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        # 瀏覽器從主機連 api,所以跟著主機上的 api 埠走
        VITE_GRAPHQL_ENDPOINT: http://localhost:${LOCAL_API_PORT:-5001}/graphql
    profiles: ["full"]
    ports:
      - "${LOCAL_ADMIN_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  mongo-data:
