# 容器名、volume 與網路由 Compose 依專案名管理(預設 = 這個資料夾的名稱;要改名在根 `.env` 設
# COMPOSE_PROJECT_NAME)。主機上的埠與 DB 名走 LOCAL_* 變數,範本與說明見根目錄 `.env.example`;
# 容器內部的埠固定不變。
services:
  # 單一成員 replica set:api 用交易(`TransactionService.withTransaction`),單節點 mongod 不支援。
  # replica set 名稱 = Compose 專案名(`COMPOSE_PROJECT_NAME`),連線字串帶 `replicaSet=<專案名>`:
  # 同機多個專案時連錯埠會直接連不上,不會靜默寫進別的專案的資料庫。
  # Compose 沒讀到 .env 時也會以專案名(不設 = 資料夾名)填入 `COMPOSE_PROJECT_NAME`;`:-wowgo-base` 只是保底。
  # 第一次起來由 healthcheck 執行 rs.initiate;選出 PRIMARY(可寫入)才算健康。
  # 成員位址登記成 localhost:27017,連線字串一律加 `directConnection=true`(容器內外、主機埠改過都連得到)。
  # 既有的 mongo-data volume 換成 replica set 啟動時資料保留(升級步驟見 docs/deployment.md「本地容器」)。
  # image 固定 patch 版本,與 CI(.github/workflows/ci.yml 的 MONGO_IMAGE)同一個,升級時兩處一起改(docs/deployment.md「MongoDB 版本」)。
  mongo:
    image: mongo:8.3.13
    restart: unless-stopped
    command:
      ["--replSet", "${COMPOSE_PROJECT_NAME:-wowgo-base}", "--bind_ip_all"]
    ports:
      - "${LOCAL_MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: '${COMPOSE_PROJECT_NAME:-wowgo-base}', members: [{ _id: 0, host: 'localhost:27017' }] }) } if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 5s
      timeout: 10s
      start_period: 10s
      retries: 12

  # 以下兩個服務屬於 "full" profile:
  #   docker compose up -d                → 只起 mongo(日常開發)
  #   docker compose --profile full up -d → 整套容器化跑起來(部署前驗證)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["full"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/${LOCAL_MONGO_DB:-wowgo-base}?directConnection=true&replicaSet=${COMPOSE_PROJECT_NAME:-wowgo-base}
      PORT: "5001"
      # 本機專用的固定值(api 沒有 JWT_SECRET 就起不來);雲端的值在 Secret Manager
      JWT_SECRET: local-dev-jwt-secret-change-me
    ports:
      - "${LOCAL_API_PORT:-5001}:5001"
    depends_on:
      mongo:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        # 瀏覽器從主機連 api,所以跟著主機上的 api 埠走
        VITE_GRAPHQL_ENDPOINT: http://localhost:${LOCAL_API_PORT:-5001}/graphql
    profiles: ["full"]
    ports:
      - "${LOCAL_ADMIN_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  mongo-data:
