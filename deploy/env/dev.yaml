# Cloud Run api 服務(`dev` 環境)的非機密環境變數(deploy.yml 以 `--env-vars-file` 整包餵入;
# 此檔是該環境全部明文變數的唯一來源 — 檔內沒寫的變數,部署後就不存在)。
# 機密(MONGODB_URI / FIELD_ENCRYPTION_KEY / JWT_SECRET / RESEND_API_KEY / REALTIME_*_SECRET)走 Secret Manager,
# 由 deploy.yml `--set-secrets` 掛入,不在此檔。變數說明:docs/env-registry.md;
# 值一律加引號(gcloud 只收字串)。NODE_ENV=production 已烘在 apps/api/Dockerfile。

# 信件連結的後台網址(連結 = <ADMIN_APP_URL>/set-password?token=…)
ADMIN_APP_URL: "https://erp-dev.scratch-lot.com"
# COOKIE_DOMAIN 不寫 = refresh cookie 不帶 Domain;api 與後台同屬一個網域時填該網域(如 ".example.com")
COOKIE_DOMAIN: ".scratch-lot.com"
# MAIL_ALLOWLIST 不寫 = 不限收件人(三環境一致,使用者裁決)
# GraphQL Sandbox / introspection:dev 開(其他環境不寫此鍵 = 關)
GRAPHQL_SANDBOX: "true"
# WORKFLOW_MAIL_ENABLED 不寫 = 通知 email 總開關關(只寫 log,站內通知照常);要寄才設 "true"
# 檔案儲存的 GCS bucket(ADR-0010;GCS_BUCKET_PRIVATE 空值 = 改用記錄用 adapter,不會真的上傳)
GCS_BUCKET_PRIVATE: "scratch-lot-assets-dev"
# 公開讀 bucket(ADR-0010):目前的呼叫端是示範模組1 的封面;用途與未設時的行為見 docs/env-registry.md
GCS_BUCKET_PUBLIC: "scratch-lot-public-dev"

# 以下皆有內建預設值,需要調整時再打開(格式:15m / 30d 等;見 apps/api/src/auth/duration.ts)
# ACCESS_TOKEN_TTL: "15m"
# REFRESH_TOKEN_TTL: "30d"
# ACTIVATION_TOKEN_TTL: "7d"
# PASSWORD_RESET_TOKEN_TTL: "30m"
# GCS_SIGNED_URL_TTL: "1h"

# 即時通道 Worker 的網址(docs/deployment.md「即時通道」);Worker 與網域見 cloud.json 的 realtime
# 不寫 = 即時通道停用(admin 每 60 秒輪詢)
REALTIME_URL: "https://rt-dev.scratch-lot.com"

# 排程任務的呼叫身分(docs/deployment.md「Cloud Scheduler」):Scheduler 工作的 OIDC SA;audience 與工作的 --oidc-token-audience 完全相同
# 不寫 = 排程端點拒絕所有呼叫(排程關閉)
SCHEDULER_INVOKER_EMAIL: "scheduler-invoker@scratch-lot-online.iam.gserviceaccount.com"
SCHEDULER_AUDIENCE: "https://api-dev.scratch-lot.com"
