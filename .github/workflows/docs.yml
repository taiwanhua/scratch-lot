name: Docs

# 純文件改動的輕量檢查(ci.yml 對這些路徑不跑):跑與 ci.yml 同一個 `format:check`(STRUCT-09)。
# 沿用同一個腳本而不另寫 md-only 的變體,是為了只有一份「哪些副檔名受守門」的正本;
# 這個 workflow 的觸發路徑只有 md,多檢查到的 ts/json/yaml 在這種 PR 裡本來就沒變動,成本只有幾秒。
on:
  pull_request:
    paths: ["docs/**", "*.md", "**/*.md"]
  push:
    branches: [main, dev, staging]
    paths: ["docs/**", "*.md", "**/*.md"]

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安裝依賴(只要根目錄的 prettier 與設定)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 格式檢查(prettier --check)
        run: pnpm run format:check
