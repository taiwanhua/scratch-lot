name: Deploy

# 部署一律手動觸發(merge 不會自動部署):
#   UI :GitHub → Actions → Deploy → Run workflow →「Use workflow from」選分支 + environment 選環境
#   CLI:gh workflow run Deploy --ref dev -f environment=dev
#        gh workflow run Deploy --ref staging -f environment=staging
#        gh workflow run Deploy --ref main -f environment=production
#
# 部署目標(GCP 專案 / 區域 / registry / WIF、各環境的服務名、API 網址、Secret 名稱、seed 帳號)不寫在本檔:
# 正本是 deploy/project/cloud.json 與 deploy/project/github.json,由「專案設定」步驟讀取並驗證。
# 設定值一律經 step 的 env 傳給腳本(以 "$VAR" 引用),不內插進 run 的程式文本。
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "部署目標(分支需對應:dev→dev、staging→staging、production→main)"
        required: true
        type: choice
        options: [dev, staging, production]
      force:
        description: "全部重部署(忽略「只部署改到的 app」判斷;第一次部署或 Cloud Run 讀不到 tag 時會自動視為全部)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # Workload Identity Federation 免金鑰認證

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 分支 ↔ 環境防呆
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$ENVIRONMENT" in
            dev)        EXPECT=dev ;;
            staging)    EXPECT=staging ;;
            production) EXPECT=main ;;
            *)
              echo "::error::未知的 environment"
              exit 1
              ;;
          esac
          if [ "$GITHUB_REF_NAME" != "$EXPECT" ]; then
            echo "::error::environment=$ENVIRONMENT 必須從分支 $EXPECT 觸發(目前分支:$GITHUB_REF_NAME)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 只部署改到的 app:要拿 git 歷史與上次部署的 SHA 比

      # 讀 deploy/project/*.json 並核對專案身分:repository 取自受信任的 github context,
      # 與設定檔的 expectedRepository 不符、環境未知或缺值時在這裡失敗,後面的雲端認證不會執行。
      # 讀取器只用 Node 內建模組(runner 內建的 node 即可,不需先 pnpm install),輸出只有非機密設定與 Secret 名稱。
      # 每次 build 使用獨立 tag,即使同一 commit 跨環境或重跑也不會移走舊 revision 的 tag。
      - name: 專案設定(核對 repo 與環境)
        id: cfg
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/project-settings/read-config.mjs --scope cloud --environment "$ENVIRONMENT" --repository "$REPOSITORY" > "$RUNNER_TEMP/project-cloud.json"
          node scripts/project-settings/write-github-output.mjs --scope cloud < "$RUNNER_TEMP/project-cloud.json"
          echo "image_tag=$(git rev-parse HEAD)-$ENVIRONMENT-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ steps.cfg.outputs.gcp_project_id }}
          workload_identity_provider: ${{ steps.cfg.outputs.wif_provider }}
          service_account: ${{ steps.cfg.outputs.deployer_sa }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: 登入 Artifact Registry
        env:
          REGISTRY_HOST: ${{ steps.cfg.outputs.registry_host }}
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      # image tag 以完整 Git SHA 開頭,後面是環境與執行識別;舊版短 SHA tag 也可讀。
      # 以它為 base 跑 turbo ls --affected(依 workspace 依賴圖:改 packages/ui 會讓 admin 受影響、改 @repo/domain 會讓 api 受影響)。
      # 讀不到 tag(第一次部署)、base 不在歷史裡(force push)、或 inputs.force 時 → 全部部署。
      - name: 受影響的 app(比對該環境目前部署的 SHA)
        id: affected
        env:
          REGION: ${{ steps.cfg.outputs.region }}
          API_SERVICE: ${{ steps.cfg.outputs.api_service }}
          ADMIN_SERVICE: ${{ steps.cfg.outputs.admin_service }}
          FORCE: ${{ inputs.force }}
        run: |
          decide() { # $1=服務名 $2=package 名 → 印 true/false
            local img base
            img=$(gcloud run services describe "$1" --region="$REGION" --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)
            base=${img##*:}; base=${base%%-*}
            if [[ ! "$base" =~ ^[0-9a-f]{7,40}$ ]]; then echo true; return; fi
            if [ "$FORCE" = "true" ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo true; return; fi
            if [ "$base" = "$(git rev-parse --short HEAD)" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then echo false; return; fi
            # 部署設定不屬於任何 package,turbo 看不到,由 deploy-affected.mjs 判斷:
            #   deploy/project/ 或 scripts/project-settings/ 有變 → api 與 admin 都重建(API 網址烘在 admin image)
            #   deploy/env/ 或本 workflow 有變 → 只有 api(admin 不吃 runtime env 檔)
            #   apps/db-migrator/ 有變(種子、快照、migration、執行器)→ 要跑 update,即使 api image 不必重建
            # 只有明確印出 false 才交給 turbo;腳本失敗或沒有輸出一律保守重建
            case "$(git diff --name-only "$base...HEAD" | node scripts/project-settings/deploy-affected.mjs "$2")" in
              false) ;;
              *) echo true; return ;;
            esac
            local list
            list=$(TURBO_SCM_BASE="$base" npx --yes turbo@$(node -p "require('./package.json').devDependencies.turbo.replace(/[^0-9.]/g,'')") ls --affected --output json | jq -r '.packages.items[].name' | tr '\n' ' ')
            case " $list " in *" $2 "*) echo true ;; *) echo false ;; esac
          }
          api=$(decide "$API_SERVICE" @repo/api)
          admin=$(decide "$ADMIN_SERVICE" @repo/admin)
          migrator=$(decide "$API_SERVICE" @repo/db-migrator)
          # api 或 db-migrator 任一有變就跑 update:只改專案種子、快照或 migration 的部署不會換 api image,
          # 但設定照樣要交付(實際的設定版本記在 seed_update_runs.releaseCommit,不以 api image 的 SHA 代替)
          update=false; { [ "$api" = true ] || [ "$migrator" = true ]; } && update=true
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
          echo "update=$update" >> "$GITHUB_OUTPUT"
          echo "::notice::部署判斷:api=$api admin=$admin update=$update(force=$FORCE)"

      # image tag = 完整 Git SHA-環境-run ID-attempt;admin 的 VITE_* build 時烘入 → 每環境各一顆
      - name: build + push api
        if: steps.affected.outputs.api == 'true'
        env:
          REGISTRY: ${{ steps.cfg.outputs.registry }}
          IMAGE_TAG: ${{ steps.cfg.outputs.image_tag }}
        run: |
          docker build -f apps/api/Dockerfile -t "$REGISTRY/api:$IMAGE_TAG" .
          docker push "$REGISTRY/api:$IMAGE_TAG"

      # admin 打的 API 端點由設定的 apiUrl 組出(不另存第二份 endpoint)
      - name: build + push admin
        if: steps.affected.outputs.admin == 'true'
        env:
          REGISTRY: ${{ steps.cfg.outputs.registry }}
          IMAGE_TAG: ${{ steps.cfg.outputs.image_tag }}
          API_URL: ${{ steps.cfg.outputs.api_url }}
        run: |
          docker build -f apps/admin/Dockerfile \
            -t "$REGISTRY/admin:$IMAGE_TAG" \
            --build-arg "VITE_GRAPHQL_ENDPOINT=$API_URL/graphql" .
          docker push "$REGISTRY/admin:$IMAGE_TAG"

      # api 的環境變數兩個來源(docs/deployment.md「四、環境變數管理」):
      #   非機密 → deploy/env/<環境>.yaml(--env-vars-file 整包取代既有明文變數;GRAPHQL_SANDBOX 也在檔內)
      #   機密   → Secret Manager(--set-secrets;secret 名稱來自 deploy/project/cloud.json 的 secrets)
      # 兩個旗標各管各的:--env-vars-file 只取代明文變數,不會清掉 --set-secrets 掛入的 secret 變數
      - name: deploy api
        if: steps.affected.outputs.api == 'true'
        env:
          API_SERVICE: ${{ steps.cfg.outputs.api_service }}
          REGION: ${{ steps.cfg.outputs.region }}
          REGISTRY: ${{ steps.cfg.outputs.registry }}
          IMAGE_TAG: ${{ steps.cfg.outputs.image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
          MONGODB_SECRET_NAME: ${{ steps.cfg.outputs.mongodb_secret }}
          ENC_SECRET_NAME: ${{ steps.cfg.outputs.enc_secret }}
          JWT_SECRET_NAME: ${{ steps.cfg.outputs.jwt_secret }}
          RESEND_SECRET_NAME: ${{ steps.cfg.outputs.resend_secret }}
        run: |
          SECRETS="MONGODB_URI=$MONGODB_SECRET_NAME:latest,FIELD_ENCRYPTION_KEY=$ENC_SECRET_NAME:latest,JWT_SECRET=$JWT_SECRET_NAME:latest"
          if [ -n "$RESEND_SECRET_NAME" ]; then
            SECRETS="$SECRETS,RESEND_API_KEY=$RESEND_SECRET_NAME:latest"
          fi
          gcloud run deploy "$API_SERVICE" --region="$REGION" \
            --image="$REGISTRY/api:$IMAGE_TAG" \
            --port=5001 --allow-unauthenticated --min-instances=0 --max-instances=2 \
            --env-vars-file="deploy/env/$ENVIRONMENT.yaml" \
            --set-secrets="$SECRETS" \
            --quiet

      - name: deploy admin
        if: steps.affected.outputs.admin == 'true'
        env:
          ADMIN_SERVICE: ${{ steps.cfg.outputs.admin_service }}
          REGION: ${{ steps.cfg.outputs.region }}
          REGISTRY: ${{ steps.cfg.outputs.registry }}
          IMAGE_TAG: ${{ steps.cfg.outputs.image_tag }}
        run: |
          gcloud run deploy "$ADMIN_SERVICE" --region="$REGION" \
            --image="$REGISTRY/admin:$IMAGE_TAG" \
            --port=8080 --allow-unauthenticated --min-instances=0 --max-instances=2 --quiet

      # 部署成功後對該環境資料庫跑一次 update:migration → 普通種子 → 受管定義 → 核對
      #(ADR-0002:CI runner 直連,不放 server 啟動;順序仍是先部署 api、再更新資料)。
      # 受管定義由 api 的 CLI 發布,所以連 api 與它的 workspace 依賴一起安裝、建置 —— 用的是這個 checkout 的產物,
      # 不是雲端上那顆(可能較舊的)api image。MONGOMS_DISABLE_POSTINSTALL 避免下載測試用的 mongod 二進位檔。
      - uses: pnpm/action-setup@v4 # 版本讀 package.json 的 packageManager 欄位
        if: steps.affected.outputs.update == 'true'

      - uses: actions/setup-node@v4
        if: steps.affected.outputs.update == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝 db-migrator 與 api 的依賴
        if: steps.affected.outputs.update == 'true'
        run: pnpm install --frozen-lockfile --filter "@repo/db-migrator..." --filter "@repo/api..."
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"

      # `...` = 連 workspace 依賴一起、依相依順序建置;建完確認 dist/seed/run.js 啟動得起來(不需要資料庫)。
      # 注意 `run update`:少了 run,pnpm 會把 update 當成它自己的升級依賴指令。
      - name: 建置 api 的受管定義 CLI
        if: steps.affected.outputs.update == 'true'
        run: |
          pnpm --filter "@repo/api..." run build
          pnpm --filter @repo/db-migrator run update --check-cli

      # 設定版本取 GITHUB_SHA(就是這次 checkout 的 commit),由指令記進 seed_update_runs
      - name: update(migration → 種子 → 定義)
        if: steps.affected.outputs.update == 'true'
        env:
          ROOT_ADMIN_ACCOUNT: ${{ steps.cfg.outputs.root_account }}
          ROOT_ADMIN_EMAIL: ${{ steps.cfg.outputs.root_email }}
          MONGODB_SECRET_NAME: ${{ steps.cfg.outputs.mongodb_secret }}
          ROOT_SECRET_NAME: ${{ steps.cfg.outputs.root_secret }}
        run: |
          MONGODB_URI=$(gcloud secrets versions access latest --secret="$MONGODB_SECRET_NAME")
          ROOT_ADMIN_PASSWORD=$(gcloud secrets versions access latest --secret="$ROOT_SECRET_NAME")
          echo "::add-mask::$MONGODB_URI"
          echo "::add-mask::$ROOT_ADMIN_PASSWORD"
          export MONGODB_URI ROOT_ADMIN_PASSWORD
          pnpm --filter @repo/db-migrator run update
