name: CI

# 純文件改動不跑本 workflow(由 docs.yml 只做 md 的 prettier 檢查);
# 注意 apps/admin/src/md/**(help.md)會被 build 進 admin,不在忽略清單內。
on:
  pull_request:
    paths-ignore: ["docs/**", "*.md", ".claude/**", ".agents/**"]
  push:
    branches: [main, dev, staging]
    paths-ignore: ["docs/**", "*.md", ".claude/**", ".agents/**"]

# 同一個 PR(或同一分支)有新 commit 時,取消還在跑的舊 run
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# job 圖(牆鐘最短優先;各 job 各一台 runner,不再搶同一台的 CPU):
#
#   project-settings             專案部署設定、讀取器與底座同步 CLI(不看受影響清單,每次都跑)
#   figma-sync                   Figma 品牌同步工具(root scripts,不看受影響清單,每次都跑)
#   prepare ─┬─ format-codegen   格式檢查 + codegen 產物一致(GQL-05)
#            ├─ lint-typecheck   turbo lint / check-types
#            ├─ test-api-1 / 2   api 的 jest 分兩片(--shard)
#            ├─ test-admin-1 / 2 admin 的 jest 分兩片(--shard)
#            ├─ test-others      api / admin 以外的 turbo test
#            └─ build            turbo build(front 的 ISR 預渲染要活的 api)
#   以上全部 ─→ verify           總結;PR 的必要檢查名稱就是它
#
# turbo 本機快取(.turbo/cache)用 actions/cache 在 run 之間保存:每個跑 turbo 的 job 各一把 key
#(job 名 + commit),restore 退回同 lockfile 的最近一份,沒改到的 package 直接 cache hit。
# 快取只加速、不改結果:turbo 的 hash 涵蓋輸入檔、env 與依賴,命中就是同一份產物。
# E2E 不在這裡(e2e.yml 手動觸發)。

jobs:
  # 算受影響的 package,結果用 outputs 給下游 job 決定跑什麼 / 要不要跳過
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
      filter: ${{ steps.affected.outputs.filter }}
      others-filter: ${{ steps.affected.outputs.others-filter }}
      any: ${{ steps.affected.outputs.any }}
      api: ${{ steps.affected.outputs.api }}
      admin: ${{ steps.affected.outputs.admin }}
      others: ${{ steps.affected.outputs.others }}
      front: ${{ steps.affected.outputs.front }}
      codegen: ${{ steps.affected.outputs.codegen }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo --affected 要拿 git 歷史算 diff

      - uses: pnpm/action-setup@v4 # 版本讀 package.json 的 packageManager 欄位

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 只為了跑 turbo ls,不需要測試用的 mongod 二進位檔
      - name: 安裝依賴
        run: pnpm install --frozen-lockfile
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"

      # 只跑「這次 diff 改到的 package + 依賴它們的 package」(turbo 依 workspace 依賴圖推導:
      # 改 packages/ui 會連 admin / front / storybook 一起跑;改根設定或 lockfile 會全跑)。
      # base:PR 對 base 分支比;push 對推送前的分支 HEAD 比(等於這次合進來的內容)。
      # 改到 .github/** 或 base 拿不到(首推、force push)時退回全跑。
      # 清單轉成明確的 `--filter=<pkg>` 字串往下傳(下游 job 不必再算 diff);
      # others-filter 是同一份清單去掉 @repo/api 與 @repo/admin(這兩個的測試最久,各由兩個 shard job 跑)。
      - name: 受影響的 package
        id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all=false
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            all=true
          elif git diff --name-only "$BASE...HEAD" | grep -q '^\.github/'; then
            all=true
          fi
          if [ "$all" = true ]; then
            list=$(pnpm exec turbo ls --output json | jq -r '.packages.items[].name' | grep -vx '//' | tr '\n' ' ' || true)
            echo "::notice::受影響範圍:全部(base 不可用或 .github 有改)"
          else
            list=$(TURBO_SCM_BASE="$BASE" pnpm exec turbo ls --affected --output json | jq -r '.packages.items[].name' | grep -vx '//' | tr '\n' ' ' || true)
            echo "::notice::受影響的 package:${list:-(無)}"
          fi
          # db-migrator 的 update 以子程序呼叫 api 建置後的受管定義 CLI(app 之間不互相 import,turbo 的
          # 套件依賴圖看不到這條關係):api 有變時也要跑 db-migrator 的測試
          case " $list " in
            *" @repo/api "*)
              case " $list " in
                *" @repo/db-migrator "*) ;;
                *) list="${list% } @repo/db-migrator" ;;
              esac
              ;;
          esac
          filter=""
          others=""
          for p in $list; do
            filter="$filter --filter=$p"
            case "$p" in @repo/api | @repo/admin) ;; *) others="$others --filter=$p" ;; esac
          done
          flag() { case " $list " in *" $1 "*) echo true ;; *) echo false ;; esac; }
          api=$(flag @repo/api)
          codegen=false
          if [ "$api" = true ] || [ "$(flag @repo/graphql)" = true ]; then codegen=true; fi
          {
            echo "packages=$list"
            echo "filter=$filter"
            echo "others-filter=$others"
            if [ -n "$filter" ]; then echo "any=true"; else echo "any=false"; fi
            if [ -n "$others" ]; then echo "others=true"; else echo "others=false"; fi
            echo "api=$api"
            echo "admin=$(flag @repo/admin)"
            echo "front=$(flag @repo/front)"
            echo "codegen=$codegen"
          } >> "$GITHUB_OUTPUT"

      # 已發布的 migration 與種子快照只能新增、不能改寫(執行過的環境不會重跑,改了兩邊就不一致)。
      # 對照同一個 base;base 拿不到(首推、force push)時沒有可比的基線,只提示不擋。
      - name: 已發布的 migration / 種子快照不可改寫
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "::notice::沒有可比對的基線,略過 migration / 種子快照的不可變檢查"
          else
            node apps/db-migrator/scripts/check-immutable-sources.mjs "$BASE"
          fi

  # 專案部署設定(deploy/project/*.json)與讀取器(scripts/project-settings/)不屬於任何 workspace,
  # turbo 的受影響清單看不到,所以不掛在 prepare 後面、每次都跑。
  # 只用 Node 內建模組:不需 pnpm install,也不碰雲端、Secret 或看板(測試用假命令與假 GitHub client)。
  # 同一 job 也跑底座同步 CLI(scripts/base-sync/)的測試:真 Git 隔離夾具,gh 是假實作,不碰真 repo 或 GitHub。
  project-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 讀取器 / schema / workflow 接線測試
        run: node --test scripts/project-settings/*.test.mjs

      - name: 底座同步 CLI 測試(inspect / upgrade / contribute)
        run: node --test scripts/base-sync/*.test.mjs

      # 以本 repo 的身分實際解析正式設定:三個環境與看板各一次(只印非機密設定與 Secret 名稱)
      - name: 正式設定 dry-run
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/project-settings/read-config.mjs --scope cloud --environment dev --repository "$REPOSITORY"
          node scripts/project-settings/read-config.mjs --scope cloud --environment staging --repository "$REPOSITORY"
          node scripts/project-settings/read-config.mjs --scope cloud --environment production --repository "$REPOSITORY"
          node scripts/project-settings/read-config.mjs --scope github --repository "$REPOSITORY"

  # Figma 品牌同步工具(scripts/figma-sync/)是 root scripts,不屬於任何 workspace:turbo 的受影響清單、
  # lint 與 check-types 都不涵蓋它,所以不掛在 prepare 後面、每次都跑。
  # 品牌測試用 @repo/ui 與 @repo/project-config 的真 exports,先 build 這兩個套件。
  # 離線執行:生成碼在測試內的 fake Figma 跑,不需要 Figma token,也不碰正式檔。
  figma-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"

      - name: build UI / project-config(品牌推導的真 exports)
        run: pnpm exec turbo run build --filter=@repo/ui --filter=@repo/project-config

      - name: 品牌投影 / core / runtime / CLI 測試
        run: node --test scripts/figma-sync/*.test.mjs

      - name: 本機 Figma 外掛測試
        run: node --test scripts/figma-local/*.test.mjs

  # prettier 不經 turbo lint(各 workspace 的 lint 只跑 eslint,且根目錄 docs/ 不屬於任何 workspace),
  # 範圍是全 repo 的 md + ts/tsx/js/json/yaml(STRUCT-09),所以不看受影響清單、每次都跑。
  # codegen 一致性檢查(GQL-05)要起一次完整 AppModule,放在這個與其他 job 並行的 job,不壓在 prepare 的關鍵路徑上。
  format-codegen:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 不加 MONGOMS_DISABLE_POSTINSTALL:schema:generate 用 mongodb-memory-server 起 mongod
      #(二進位在 pnpm install 的 postinstall 下載,見根 package.json 的 onlyBuiltDependencies)
      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 格式檢查(prettier --check)
        run: pnpm run format:check

      - name: turbo 快取
        if: needs.prepare.outputs.codegen == 'true'
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-format-codegen-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-format-codegen-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # `generate` 寫產物前會先跑 scripts/check-documents.mjs(底座 / 專案兩個來源的 operation、fragment 不得重名)。
      # 正式來源是乾淨的,下一步的 generate 只走得到正例;重名、匿名、散落文件這些負例由這支 Node 測試用暫存目錄驗。
      # 用專屬的 test:documents 而不是 test:test-others 會把 jest 的旗標(--forceExit)傳給每個 package 的 test,node --test 不吃。
      - name: GraphQL 文件登記檢查的負例測試
        if: needs.prepare.outputs.codegen == 'true'
        run: pnpm --filter @repo/graphql test:documents

      # GQL-05:`apps/api/schema.gql` 與 `packages/graphql/src/generated` 都是產物。
      # api-only 的票改了 resolver 卻沒重產時,型別要等下一張 admin 票才更新,之前沒有任何一步抓得到。
      # 只在 api 或 graphql 受影響時跑。
      - name: codegen 產物與 schema 一致(GQL-05)
        if: needs.prepare.outputs.codegen == 'true'
        run: |
          # schema:generate 用 ts-node 直接載 api 原始碼,要先有 @repo/domain 與 @repo/project-config 的 dist
          # 才解析得到 `@repo/domain/*`、`@repo/project-config/mail`(信件模板載入時就讀專案設定)
          pnpm exec turbo run build --filter=@repo/domain --filter=@repo/project-config
          pnpm --filter @repo/api schema:generate
          pnpm --filter @repo/graphql generate
          if ! git diff --exit-code -- apps/api/schema.gql packages/graphql/src/generated; then
            echo "::error::api 改了 schema 但沒重產。請在本機跑 pnpm --filter @repo/api schema:generate 與 pnpm --filter @repo/graphql generate,把上面 diff 的兩份產物一起 commit(GQL-05)"
            exit 1
          fi

      # 快取是「還原 → 本次新增」的累積,存回前清掉 7 天前的項目,免得無限長大
      - name: 修剪 turbo 快取
        if: needs.prepare.outputs.codegen == 'true'
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  lint-typecheck:
    needs: prepare
    if: needs.prepare.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"

      - name: turbo 快取
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-lint-typecheck-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-lint-typecheck-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # `--log-order=stream` 即時印出各套件輸出,卡在哪一眼可見
      - name: lint / typecheck
        run: pnpm exec turbo run lint check-types ${{ needs.prepare.outputs.filter }} --log-order=stream

      - name: 修剪 turbo 快取
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  # api 的測試最久(整合測試對真 MongoDB),用 jest 的 --shard 分兩台並行。
  # 直接 exec jest 而不走 `pnpm run test -- …`(後者的參數會被 jest 當成路徑 pattern);
  # 旗標與 apps/api/package.json 的 test script 相同,再加 --forceExit / --shard。
  # api 的 jest 以 moduleNameMapper 直接吃 @repo/domain 原始碼,不必先 build 依賴,所以這裡不用 turbo。
  test-api:
    needs: prepare
    if: needs.prepare.outputs.api == 'true'
    name: test-api-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      # `--forceExit`:測試全過但有殘留 handle 時仍會退出,並把偵測到的 handle 印進 log(--detectOpenHandles)
      - name: test(api 第 ${{ matrix.shard }} / 2 片)
        run: pnpm --filter @repo/api exec jest --passWithNoTests --detectOpenHandles --forceExit --shard=${{ matrix.shard }}/2
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/wowgo-base

  # admin 的測試(約 600 案、單跑 5 分多)同樣用 jest 的 --shard 分兩台。
  # admin 的 jest 吃依賴的 dist(與 turbo 的 test dependsOn ^build 一致),先用 turbo build 依賴(`^...` = 不含 admin 本身),
  # 快取命中時幾秒就過;jest 的呼叫方式與 apps/admin/package.json 的 test script 相同。
  test-admin:
    needs: prepare
    if: needs.prepare.outputs.admin == 'true'
    name: test-admin-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"

      # 兩片產生的快取內容相同,共用一把 key(後存的那片存不進去只是警告)。
      # 自己的 key 找不到時先退回 lint-typecheck 的:兩者 build 依賴的 turbo hash 相同;
      # 同一個依賴 build 在 test-others 算出的 hash 不同(實測;該 job 的 run 多了 env 與 `-- --forceExit`),退回它等於沒命中
      - name: turbo 快取
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-test-admin-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-test-admin-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-lint-typecheck-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: build admin 的依賴
        run: pnpm exec turbo run build --filter=@repo/admin^... --log-order=stream

      - name: test(admin 第 ${{ matrix.shard }} / 2 片)
        run: pnpm --filter @repo/admin exec node --experimental-vm-modules node_modules/jest/bin/jest.js --forceExit --shard=${{ matrix.shard }}/2

      - name: 修剪 turbo 快取
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  # api / admin 以外受影響 package 的測試(domain / ui / i18n / logger / db-migrator …)
  # MONGODB_URI:db-migrator 測試沿用本 job 的 MongoDB service container(本地無此變數時自起 mongodb-memory-server)
  # db-migrator 的 update 測試以子程序跑 api 的受管定義 CLI:它的 test 在 turbo 裡依賴 @repo/api#build
  #(apps/db-migrator/turbo.json),所以這裡會先建置 api 與 @repo/domain 等執行期依賴,不靠本機恰好留著的 dist;
  # 這些測試對真 MongoDB 逐一驗故障窗口,時間較長,逾時放寬到 30 分鐘。
  test-others:
    needs: prepare
    if: needs.prepare.outputs.others == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: turbo 快取
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-test-others-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-test-others-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: test
        run: pnpm exec turbo run test ${{ needs.prepare.outputs.others-filter }} --log-order=stream -- --forceExit
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/wowgo-base

      - name: 修剪 turbo 快取
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  build:
    needs: prepare
    if: needs.prepare.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"

      - name: turbo 快取
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-build-
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # front 的 ISR 預渲染需要活的 api;front 沒被改到就不用起
      - name: 建置 api(front 的 ISR 預渲染需要活的 api)
        if: needs.prepare.outputs.front == 'true'
        run: pnpm exec turbo run build --filter=@repo/api

      - name: 啟動 api(接 CI 的拋棄式 MongoDB,空資料庫)
        if: needs.prepare.outputs.front == 'true'
        run: |
          node apps/api/dist/main.js &
          timeout 60 bash -c 'until curl -sf -X POST -H "Content-Type: application/json" -d "{\"query\":\"{__typename}\"}" http://127.0.0.1:5001/graphql -o /dev/null; do sleep 2; done'
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/wowgo-base
          PORT: "5001"
          # api 缺少 JWT_SECRET 即啟動失敗;CI 只需一個假值讓 front 預渲染能打到 api
          JWT_SECRET: ci-only-jwt-secret

      - name: build
        run: pnpm exec turbo run build ${{ needs.prepare.outputs.filter }} --log-order=stream
        env:
          NEXT_PUBLIC_GRAPHQL_ENDPOINT: http://127.0.0.1:5001/graphql

      - name: 修剪 turbo 快取
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

  # 總結 job:名稱固定 `verify`(PR 的必要檢查),branch 設定不必跟著 job 拆分改。
  # 被跳過(skipped:不在受影響清單)的 job 算過;任一 failure / cancelled 就紅,
  # 哪一類壞看上面的 job 名稱即可。
  verify:
    needs:
      [
        prepare,
        project-settings,
        figma-sync,
        format-codegen,
        lint-typecheck,
        test-api,
        test-admin,
        test-others,
        build,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 彙整各 job 結果
        env:
          NEEDS: ${{ toJSON(needs) }}
          PACKAGES: ${{ needs.prepare.outputs.packages }}
        run: |
          echo "受影響的 package:${PACKAGES:-(無)}"
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ -n "$bad" ]; then
            echo "::error::未通過的 job:$bad"
            exit 1
          fi
