name: E2E

# 權限劇本的 E2E(正本:docs/testing/permission-scenarios.md;寫法規範 TEST-05 / TEST-11)。
# **只有手動觸發,不進 ci.yml**:每條劇本要 build api + admin、起 Mongo、執行 update 再開瀏覽器,
# 放進每個 PR 會把免費方案的 Actions 額度吃光。
#   UI :GitHub → Actions → E2E → Run workflow → 選分支(+ 可填 grep)
#   CLI:gh workflow run e2e.yml --ref <分支> -f grep="劇本 7"
#
# 這個 workflow **不碰任何真實環境**:資料庫由 harness 自起單一成員 replica set(MongoMemoryReplSet,
# 拋棄式;api 的交易需要 replica set,而 service container 不能帶 --replSet 啟動參數),
# 帳密用 apps/e2e/.env.example 的測試值,一個 Secret 都不讀。
#
# 檔案儲存(劇本 11 / 15)走 fake GCS 容器(fsouza/fake-gcs-server),**不寫成下面的 `services:`**:
# service container 不能帶啟動參數,而這個映像不給參數就是 https + 自簽憑證 + 公開網址指向
# storage.googleapis.com,瀏覽器與 api 都連不上。所以改由 harness 以 apps/e2e/docker-compose.yml
# `up -d` / `down`(與本機 `pnpm e2e` 同一份,runner 內建 Docker);bucket 由 harness 建,
# 簽名用的假憑證由 harness 每次現產 —— 同樣一個 Secret 都不讀。
on:
  workflow_dispatch:
    inputs:
      grep:
        description: "只跑標題符合的劇本(Playwright --grep;留空 = 全部)。例:劇本 7"
        required: false
        type: string

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Linux 核心 6.19 以上與 MongoDB 8.x 的 TCMalloc 不相容(SERVER-121912):mongod 一啟動就自行退出。
# GitHub 的 ubuntu-24.04 runner 已換到 6.19 核心,緊急繞過:glibc 的 rseq 交給 TCMalloc 自己用。
# 套用到本 workflow 的所有行程(mongodb-memory-server 起的 mongod 繼承它;docker 的 mongo 另以 -e 傳入)。
# 退場:runner 核心 ≥ 7.0.14,或 MongoDB 出修正版後拿掉(見 docs/deployment.md「CI」)。
env:
  GLIBC_TUNABLES: glibc.pthread.rseq=1

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本讀 package.json 的 packageManager 欄位

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # mongod 二進位快取(MongoMemoryReplSet 用;版本由 mongodb-memory-server 決定,跟 lockfile 走)
      - name: 快取 mongod 二進位
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      # postinstall 下載 harness 自起 replica set 用的 mongod(快取命中就跳過下載)
      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 快取 Playwright 瀏覽器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # 只裝 chromium(playwright.config.ts 也只宣告這一個 project)
      - name: 安裝 chromium
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      # build api / admin、update、起 fake GCS / api / admin 都在 globalSetup 裡(apps/e2e/src/harness/stack.ts)
      - name: 跑劇本
        run: pnpm e2e
        env:
          E2E_GREP: ${{ inputs.grep }}
          # fake GCS 起不來就整個失敗:本機沒有 Docker 時劇本 11 / 15 會 skip,CI 不允許這種「看起來綠」
          E2E_GCS_REQUIRED: "1"

      - name: 上傳報告(含失敗時的 trace 與截圖)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
